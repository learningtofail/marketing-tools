<!--META {"title":"Promotional Capacity Sanity-Checker","short":"Green, yellow or red score for a planned discount: margin, warehouse strain and support load.","desc":"Check a planned discount or flash sale before committing to launch dates. See contribution margin compression, break-even volume lift, warehouse and support utilization, and pull-forward cost.","tag":"Planning"} -->
<div class="split">
  <div>
    <div class="card"><h3>Unit economics</h3><div id="f1"></div></div>
    <div class="card"><h3>Promotion</h3><div id="f2"></div></div>
    <div class="card"><h3>Operations</h3><div id="f3"></div></div>
  </div>
  <div id="out" class="out"></div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, C = MT.chart;
MT.fields($('#f1'), [{ id: 'price', label: 'Regular price ($)', value: 60 }, { id: 'cogs', label: 'COGS per order ($)', value: 21 }, { id: 'ship', label: 'Shipping per order ($)', value: 6 }, { id: 'pick', label: 'Pick and pack per order ($)', value: 2.5 }, { id: 'fee', label: 'Payment fee (%)', value: 2.9 }, { id: 'base', label: 'Baseline orders per day', value: 150 }], 'g2');
MT.fields($('#f2'), [{ id: 'disc', label: 'Discount (%)', value: 30 }, { id: 'mult', label: 'Expected order volume multiple', value: 2.5, hint: '2.5 means 2.5 times baseline orders.' }, { id: 'days', label: 'Promo duration (days)', value: 4 }, { id: 'mkt', label: 'Extra marketing cost ($)', value: 6000 }, { id: 'pull', label: 'Pull-forward (% of extra orders taken from later weeks)', value: 30 }, { id: 'ret', label: 'Return rate during promo (%)', value: 14 }, { id: 'ret0', label: 'Baseline return rate (%)', value: 9 }], 'g2');
MT.fields($('#f3'), [{ id: 'wh', label: 'Max orders shipped per day', value: 420, hint: 'For a service, read this as appointments per day.' }, { id: 'tk', label: 'Support tickets per 100 orders (baseline)', value: 7 }, { id: 'tkm', label: 'Ticket rate multiple during promo', value: 1.4 }, { id: 'tkc', label: 'Cost per ticket ($)', value: 4.5 }, { id: 'sc', label: 'Support capacity (tickets per day)', value: 55 }, { id: 'peak', label: 'Launch-day peak (times the average promo day)', value: 1, hint: 'Email-led launches often run 1.4 to 2 times the average on day one. 1 means no peak.' }, { id: 'stock', label: 'Orders you can fill from stock (optional)', value: '', hint: 'Leave blank if you do not know. Without it, inventory is not checked.' }], 'g2');
function calc(o) {
  const disc = o.disc / 100, pp = o.price * (1 - disc);
  const mBase = o.price * (1 - o.ret0 / 100) - o.cogs * 1 - o.ship - o.pick - o.price * o.fee / 100 - o.tk / 100 * o.tkc;
  const mPromo = pp * (1 - o.ret / 100) - o.cogs - o.ship - o.pick - pp * o.fee / 100 - o.tk * o.tkm / 100 * o.tkc;
  const orders = o.base * o.mult, baseTot = o.base * o.days * mBase, promoTot = orders * o.days * mPromo - o.mkt, pullLoss = o.pull / 100 * Math.max(0, orders - o.base) * o.days * mBase;
  return { mBase, mPromo, orders, baseTot, promoTot, pullLoss, incr: promoTot - baseTot - pullLoss };
}
const REQ = [['price', 'Regular price', 0.01, 1e9], ['cogs', 'COGS per order', 0, 1e9], ['ship', 'Shipping per order', 0, 1e9], ['pick', 'Pick and pack per order', 0, 1e9], ['fee', 'Payment fee', 0, 100], ['base', 'Baseline orders per day', 0.01, 1e9], ['disc', 'Discount', 0, 99.99], ['mult', 'Expected order volume multiple', 0.01, 1000], ['days', 'Promo duration (days)', 0.01, 3650], ['mkt', 'Extra marketing cost', 0, 1e9], ['pull', 'Pull-forward', 0, 100], ['ret', 'Return rate during promo', 0, 100], ['ret0', 'Baseline return rate', 0, 100], ['tk', 'Support tickets per 100 orders', 0, 1e6], ['tkm', 'Ticket rate multiple', 0, 1000], ['tkc', 'Cost per ticket', 0, 1e9], ['peak', 'Launch-day peak', 0.01, 100]];
const FRACTION = [['fee', 'Payment fee', 0.5], ['disc', 'Discount', 1], ['pull', 'Pull-forward', 1], ['ret', 'Return rate', 1], ['ret0', 'Baseline return rate', 1]];
function run() {
  const o = {}; REQ.forEach(r => o[r[0]] = MT.f(r[0])); ['wh', 'sc', 'stock'].forEach(k => o[k] = MT.f(k));
  const bad = []; REQ.forEach(([k, l, lo, hi]) => { if (!isFinite(o[k])) bad.push(`${l} is blank or not a number.`); else if (o[k] < lo || o[k] > hi) bad.push(`${l} must be ${lo > 0 ? 'above 0' : 'at least 0'}${hi < 1e5 ? ' and at most ' + Math.floor(hi * 100) / 100 : ''}.`); });
  FRACTION.forEach(([k, l, t]) => { if (isFinite(o[k]) && o[k] > 0 && o[k] < t) bad.push(`${l} is ${o[k]}%. If you meant ${+(o[k] * 100).toPrecision(6)}%, type ${+(o[k] * 100).toPrecision(6)}, not ${o[k]}. Percent fields take whole percent numbers.`); });
  ['wh', 'sc', 'stock'].forEach(k => { const v = $('#f_' + k).value.trim(); if (v !== '' && (!isFinite(o[k]) || o[k] <= 0)) bad.push(`${{ wh: 'Max orders shipped per day', sc: 'Support capacity', stock: 'Orders you can fill from stock' }[k]} must be a positive number, or left blank.`); });
  if (bad.length) { $('#out').innerHTML = MT.notComputed('Not computed: check your inputs', bad); return; }
  ['wh', 'sc', 'stock'].forEach(k => { if (!(o[k] > 0)) o[k] = NaN; });
  const r = calc(o), hasW = isFinite(o.wh), hasS = isFinite(o.sc), hasI = isFinite(o.stock), utilW = hasW ? r.orders / o.wh : NaN, utilWpk = hasW ? utilW * o.peak : NaN, tickets = r.orders * o.tk * o.tkm / 100, utilS = hasS ? tickets / o.sc : NaN, compress = 1 - r.mPromo / r.mBase;
  const den = o.base * o.days * (r.mPromo - o.pull / 100 * r.mBase), kStar = den > 0 ? (o.mkt + o.base * o.days * r.mBase * (1 - o.pull / 100)) / den : Infinity;
  const need = r.orders * o.days, stockDays = hasI ? o.stock / r.orders : NaN;
  const red = [], yel = [], skipped = [];
  if (r.mPromo < 0) red.push(`Each promo order loses ${F.money(-r.mPromo, 2)}.`); if (r.incr < 0) red.push(`The promotion costs ${F.money(-r.incr, 0)} of contribution versus not running it.`); else if (r.incr < 0.2 * Math.max(1, r.baseTot)) yel.push(`Incremental contribution of ${F.money(r.incr, 0)} is thin against a baseline of ${F.money(r.baseTot, 0)}.`);
  if (hasW) { if (utilW > 1) red.push(`Order volume is ${F.pct(utilW, 0)} of daily shipping capacity.`); else if (utilWpk > 1) yel.push(`The average promo day fits (${F.pct(utilW, 0)} of capacity) but a launch-day peak would reach ${F.pct(utilWpk, 0)}.`); else if (utilW > 0.8) yel.push(`Shipping runs at ${F.pct(utilW, 0)} of capacity.`); } else skipped.push('shipping capacity');
  if (hasS) { if (utilS > 1) red.push(`Support demand is ${F.pct(utilS, 0)} of daily ticket capacity.`); else if (utilS > 0.8) yel.push(`Support runs at ${F.pct(utilS, 0)} of capacity.`); } else skipped.push('support capacity');
  if (hasI) { if (stockDays < o.days) red.push(`Stock covers ${stockDays.toFixed(1)} of ${o.days} promo days at the planned volume (${F.int(o.stock)} orders in stock, ${F.int(need)} needed). It runs out on day ${Math.floor(stockDays) + 1}.`); }
  if (compress > 0.5 && r.mPromo >= 0) yel.push(`Margin per order falls ${F.pct(compress, 0)}.`); if (o.mult < kStar && isFinite(kStar)) (r.incr < 0 ? red : yel).push(`You need ${kStar.toFixed(2)}x volume to break even and are planning ${o.mult}x.`);
  if (skipped.length) yel.push(`Not checked because the field is blank: ${skipped.join(', ')}.`);
  const level = red.length ? 'red' : yel.length ? 'yellow' : 'green', reasons = red.concat(yel); if (!reasons.length) reasons.push('Margin, shipping and support stay within the limits you entered.'); if (!hasI) reasons.push('Stock was not checked: enter the orders you can fill to test for a stockout.');
  let h = MT.rag(level, level === 'red' ? 'Red: do not launch as planned' : level === 'yellow' ? (!red.length && skipped.length && yel.length === 1 ? 'Yellow: incomplete check' : 'Yellow: launch only with mitigations') : 'Green: margin and capacity look fine', reasons);
  const low = calc(Object.assign({}, o, { mult: Math.max(0.01, o.mult * 0.75) })).incr;
  h += MT.stats([['Margin per order', `${F.money(r.mBase, 2)} to ${F.money(r.mPromo, 2)}`, compress > 1 ? 'promo orders lose money' : 'compression ' + F.pct(compress, 0), r.mPromo > 0 ? '' : 'bad'], ['Incremental contribution', F.money(r.incr, 0), 'after marketing and pull-forward', r.incr >= 0 ? 'good' : 'bad'], ['If volume is 25% below plan', F.money(low, 0), `${(o.mult * 0.75).toFixed(2)}x instead of ${o.mult}x`, low >= 0 ? 'good' : 'bad'], ['Break-even volume multiple', isFinite(kStar) ? kStar.toFixed(2) + 'x' : 'unreachable', 'planned ' + o.mult + 'x'], ['Shipping utilization', hasW ? F.pct(utilW, 0) : 'Not checked', hasW ? F.int(r.orders) + ' of ' + F.int(o.wh) + ' orders/day' : 'capacity left blank', hasW ? MT.tone(utilW, 0.8, 1, true) : ''], ['Support utilization', hasS ? F.pct(utilS, 0) : 'Not checked', hasS ? (tickets < 20 ? tickets.toFixed(1) : F.int(tickets)) + ' of ' + F.int(o.sc) + ' tickets/day' : 'capacity left blank', hasS ? MT.tone(utilS, 0.8, 1, true) : ''], ['Stock cover', hasI ? stockDays.toFixed(1) + ' days' : 'Not checked', hasI ? 'of ' + o.days + ' promo days' : 'stock left blank', hasI ? (stockDays >= o.days ? 'good' : 'bad') : ''], ['Pull-forward cost', F.money(r.pullLoss, 0), F.pct(o.pull / 100, 0) + ' of extra orders']]);
  h += '<div class="card"><div id="ch"></div></div>';
  const discs = [10, 15, 20, 25, 30, 40, 50], mults = [1.5, 2, 2.5, 3, 4, 5];
  h += '<div class="card"><h3>Incremental contribution: discount vs volume multiple</h3><p class="sub">Green is above zero, amber is up to 20% of baseline contribution, red is a loss. Other inputs as entered. Cells marked * need more orders per day than your shipping capacity or stock allows. Volume is entered by hand for each cell: a deeper discount does not raise it automatically.</p>' + MT.tbl(['Discount \\ Volume'].concat(mults.map(m => m + 'x')), discs.map(d => [d + '%'].concat(mults.map(m => { const x = calc(Object.assign({}, o, { disc: d, mult: m })).incr, t = x < 0 ? 'bad' : x < 0.2 * Math.max(1, r.baseTot) ? 'warn' : 'good', over = (hasW && o.base * m > o.wh) || (hasI && o.base * m * o.days > o.stock); return { h: `<span style="display:block;padding:.15rem .3rem;${MT.cellTone(t)}${over ? ';opacity:.45' : ''}">${F.money(x, 0)}${over ? ' *' : ''}</span>`, cls: 'c' }; }))), { cls: 'heat' }) + '</div>';
  h += MT.note('<b>What this checks.</b> Margin, shipping and support load, and stock if you entered it. It does not model repeat purchases from new customers, subscriptions, or advertising rules for discounts in regulated sectors. Support tickets usually arrive a few days after the orders, so the real peak can land after the promo ends. Returned orders are treated as refunded revenue with product and shipping cost lost, and the payment fee is not refunded.');
  $('#out').innerHTML = h;
  C.bars($('#ch'), { title: 'Contribution over the promo window', cats: ['Baseline (no promo)', 'Promo, gross', 'Promo, net of pull-forward'], series: [{ name: 'Contribution ($)', values: [r.baseTot, r.promoTot, r.promoTot - r.pullLoss], color: 'var(--series-1)' }], yFmt: v => F.money(v, 0) });
}
MT.live(document.querySelector('.split'), run);
})();
</script>
