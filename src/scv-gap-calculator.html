<!--META {"title":"Single Customer View Gap Calculator","short":"Turn identity fragmentation into fragmented-journey share, ghost users and wasted ad spend, with a confidence range.","desc":"Enter audience size, cookie lifetime, cross-device behavior and match rates between CRM, ESP and web analytics. A Monte Carlo model projects unstitched journeys, ghost users, duplicate lead waste and the ad spend lost to untracked paths.","tag":"Data governance"} -->
<div class="split">
<div>
  <div class="card"><h3>Audience and behavior</h3><div id="f1"></div></div>
  <div class="card"><h3>Identity match rates</h3><div id="f2"></div></div>
  <div class="card"><h3>Money</h3><div id="f3"></div>
    <div class="field"><label for="unc">Input uncertainty (plus or minus, %)</label><input id="unc" type="range" min="0" max="40" value="15"><span class="hint" id="uncv">15%</span></div>
    <div class="actions"><button class="btn btn-secondary btn-sm" id="rerun" type="button">Rerun simulation</button></div></div>
</div>
<div id="out" class="out"></div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, S = MT.stat, C = MT.chart; let seed = 42;
MT.fields($('#f1'), [{ id: 'aud', label: 'Real customers and prospects in scope', value: 250000, hint: 'Count of people, including prospects. The model treats all of them as active.' }, { id: 'cookie', label: 'Effective cookie lifetime (days)', value: 14, hint: 'Safari caps script-set cookies at 7 days (24 hours after a click from a tracker-flagged domain). Use 7 for a Safari-heavy audience, a mix for everyone else.' }, { id: 'gap', label: 'Average days between visits', value: 9 }, { id: 'multi', label: 'Users on 2 or more devices (%)', value: 45 }, { id: 'dev', label: 'Average devices for multi-device users', value: 2.4 }, { id: 'spm', label: 'Sessions per active user per month', value: 3.2 }], 'g2');
MT.fields($('#f2'), [{ id: 'web', label: 'Web sessions matched to a CRM ID (%)', value: 28, hint: 'Share of sessions with a login, form fill or email click ID.' }, { id: 'consent', label: 'Visitors who consent to analytics cookies (%)', value: 100, hint: 'Caps what any match rate can reach. Visitors who decline are not waste. Use your consent banner rate; 100 means no cap.' }, { id: 'dup', label: 'CRM duplicate contact rate (%)', value: 11, hint: 'Depends on the match key: normalised email is a safe baseline, fuzzy name matching can inflate it 2 to 3 times and merges different people. Measure it on your CRM first.' }], 'g2');
MT.fields($('#f3'), [{ id: 'spend', label: 'Monthly ad spend ($)', value: 180000 }, { id: 'dep', label: 'Spend that depends on identity (%)', value: 45, hint: 'Retargeting, lookalikes, frequency caps, CRM audiences, attribution-based bidding.' }, { id: 'red', label: 'Share of fragmented spend that is redundant (%)', value: 35 }, { id: 'cpl', label: 'Cost to acquire one lead ($)', value: 38 }, { id: 'leads', label: 'New leads per month', value: 4200 }, { id: 'cpc', label: 'Cost per contact per month in ESP ($)', value: 0.02 }], 'g2');
function tri(r, v, u) { return v * (1 + u * (2 * r.u() - 1)); }
function clampP(x) { return Math.min(0.999, Math.max(0.001, x)); }
const REQ = [['aud', 'Real customers and prospects', 1, 1e10], ['cookie', 'Cookie lifetime', 0.01, 3650], ['gap', 'Average days between visits', 0.01, 3650], ['multi', 'Users on 2 or more devices', 0, 100], ['dev', 'Average devices', 1, 50], ['spm', 'Sessions per active user', 0.01, 1000], ['web', 'Web sessions matched', 0, 100], ['consent', 'Consent share', 0, 100], ['dup', 'CRM duplicate rate', 0, 100], ['spend', 'Monthly ad spend', 0, 1e12], ['dep', 'Spend that depends on identity', 0, 100], ['red', 'Redundant share', 0, 100], ['cpl', 'Cost per lead', 0, 1e9], ['leads', 'New leads per month', 0, 1e9], ['cpc', 'Cost per contact', 0, 1e6]];
function run() {
  const u = +$('#unc').value / 100; $('#uncv').textContent = Math.round(u * 100) + '%'; const p = {}; REQ.forEach(r => p[r[0]] = MT.f(r[0]));
  const bad = []; REQ.forEach(([k, l, lo, hi]) => { if (!isFinite(p[k])) bad.push(`${l} is blank or not a number.`); else if (p[k] < lo || p[k] > hi) bad.push(`${l} must be between ${lo} and ${hi > 1e5 ? 'a realistic amount' : hi}.`); });
  if (bad.length) { $('#out').innerHTML = MT.notComputed('Not computed: check your inputs', bad); return; }
  const notes = []; [['multi', 'Multi-device share'], ['web', 'Web match rate'], ['dup', 'Duplicate rate'], ['dep', 'Identity-dependent spend'], ['red', 'Redundant share']].forEach(([k, l]) => { if (p[k] > 0 && p[k] < 1) notes.push(`${l} is ${p[k]}%. If you meant ${+(p[k] * 100).toPrecision(4)}%, type ${+(p[k] * 100).toPrecision(4)}, not ${p[k]}.`); });
  const cons = p.consent / 100, webEff = Math.min(p.web, p.consent); if (p.web > p.consent) notes.push(`Web match rate (${p.web}%) is above the consent share (${p.consent}%), so the model uses ${p.consent}%.`);
  const N = 4000, r = MT.rng(seed), frag = [], ghost = [], waste = [], dupW = [], adW = [], unstitched = [];
  for (let i = 0; i < N; i++) {
    const cookie = Math.max(1, tri(r, p.cookie, u)), gap = Math.max(1, tri(r, p.gap, u)), multi = clampP(tri(r, p.multi / 100, u)), dev = Math.max(1, tri(r, p.dev, u)), web = clampP(tri(r, webEff / 100, u)), dup = clampP(tri(r, p.dup / 100, u)), spend = tri(r, p.spend, u * 0.3), dep = clampP(tri(r, p.dep / 100, u)), red = clampP(tri(r, p.red / 100, u)), spm = Math.max(1, tri(r, p.spm, u));
    const pExpire = Math.exp(-cookie / gap), pFrag = 1 - (1 - multi * (1 - web)) * (1 - pExpire * (1 - web)), cookiesPerUser = (1 - multi) * 1 + multi * dev, resets = Math.max(0, spm - 1) * pExpire * (1 - web);
    const idsPerUser = cookiesPerUser + resets, ghosts = p.aud * (idsPerUser - 1) * (1 - web * 0.6), dupWaste = dup * p.leads * tri(r, p.cpl, u) + dup * p.aud * tri(r, p.cpc, u), adWaste = spend * dep * pFrag * red;
    frag.push(pFrag); ghost.push(ghosts); dupW.push(dupWaste); adW.push(adWaste); waste.push(dupWaste + adWaste); unstitched.push(pFrag * spm * p.aud);
  }
  const q = (a, x) => S.quantile(a, x), m = a => S.mean(a), ci = (a, f) => u === 0 ? 'no band (uncertainty slider at 0)' : `${f(q(a, 0.1))} to ${f(q(a, 0.9))}`;
  const fr = m(frag), gh = m(ghost), tot = m(waste), bandNote = u === 0 ? '' : ` Sensitivity band if every input is off by up to ${Math.round(u * 100)}%: ${ci(waste, v => F.money(v, 0))}. It shows how far your own guesses can move the result, not statistical confidence.`;
  let h = MT.verdict(fr > 0.4 ? 'neg' : 'neu', `Estimated gap cost: about ${F.money(tot, 0)} per month, from your assumptions`, `${F.pct(fr, 0)} of customer journeys are fragmented in this model. ${F.money(m(adW), 0)} a month is ad spend on untracked or redundant paths. ${F.money(m(dupW), 0)} a month is duplicate lead and contact waste, which comes from CRM hygiene and not from journey fragmentation. These are typed assumptions, not measurements of your data.${bandNote}`);
  if (notes.length) h += '<div class="note warn" role="note"><b>Check these</b><ul>' + notes.map(t => '<li>' + MT.esc(t) + '</li>').join('') + '</ul></div>';
  h += MT.stats([['Fragmented journeys', F.pct(fr, 0), 'band ' + ci(frag, v => F.pct(v, 0)), fr > 0.4 ? 'bad' : fr > 0.2 ? 'warn' : 'good'], ['Ghost users', F.int(gh), 'extra IDs beyond ' + F.int(p.aud) + ' people, counting prospects as active; grows with the time window'], ['Unstitched sessions / month', F.int(m(unstitched)), 'if every person in scope is active'], ['Ad spend wasted / month', F.money(m(adW), 0), F.pct(m(adW) / Math.max(p.spend, 1), 1) + ' of spend'], ['Duplicate lead waste / month', F.money(m(dupW), 0), F.pct(p.dup / 100, 0) + ' duplicate rate, counted as fully wasted'], ['Annual cost of the gap', F.money(tot * 12, 0), u === 0 ? 'no band (slider at 0)' : 'band ' + ci(waste, v => F.money(v * 12, 0))]]);
  h += '<div class="card"><div id="c1"></div></div>';
  const wasteAt = (web, cookie) => { const pE = Math.exp(-cookie / p.gap), pf = 1 - (1 - p.multi / 100 * (1 - web)) * (1 - pE * (1 - web)); return p.spend * p.dep / 100 * pf * p.red / 100; };
  const w0 = wasteAt(webEff / 100, p.cookie), l1 = w0 - wasteAt(Math.min(0.99, cons, webEff / 100 + 0.1), p.cookie), l3 = w0 - wasteAt(webEff / 100, p.cookie * 2);
  h += '<div class="card"><h3>What moves the number</h3>' + MT.tbl(['Lever', 'Monthly saving (approx.)'], [['Raise web-to-CRM match by 10 points (capped at your consent share)', F.money(Math.max(0, l1), 0)], ['Deduplicate CRM contacts (halve the duplicate rate; assumes no wrong merges)', F.money(m(dupW) / 2, 0)], ['Double the effective cookie life (for example first-party server-side tagging)', F.money(Math.max(0, l3), 0)]], { num: [1] }) + '</div>';
  h += MT.note('<b>Privacy.</b> A higher match rate means linking more visitors to CRM records. Under GDPR, ePrivacy, CASL and Quebec Law 25 that usually needs consent, and cross-system profiling can need an impact assessment. Visitors who decline tracking are not waste. Check with counsel before you act on the match-rate lever, especially for health, donor or financial data.');
  h += MT.note('<b>Model.</b> Each of 4,000 draws varies every input by up to the uncertainty you set. A cookie expires between visits with probability exp(-lifetime / mean gap). A journey is fragmented when a user is on several devices or has an expired cookie and the session cannot be matched to a CRM ID. Ghost users are extra IDs beyond real people. Ad waste is identity-dependent spend, times the fragmented share, times the redundant share. The CRM to ESP match rate is not modelled. This tool sees no customer data: measure your duplicate and match rates first, and say which match key you used.');
  $('#out').innerHTML = h;
  C.hist($('#c1'), { title: 'Distribution of monthly waste across simulations', values: waste, marker: tot, markerLabel: 'Mean', bins: 28, xFmt: v => F.money(v, 0) });
}
$('#uncv').textContent = '15%'; $('#rerun').addEventListener('click', () => { seed = Math.floor(Math.random() * 1e6); run(); });
MT.live(document.querySelector('.split'), run);
})();
</script>
