<!--META {"title":"Affiliate Revenue Concentration Risk Analyzer","short":"HHI, Pareto and dependency flags that show how exposed your program is to a few partners.","desc":"Upload an affiliate platform report and measure concentration with the Herfindahl-Hirschman Index, Pareto distribution and top-partner dependency, plus what happens if your biggest partners leave.","tag":"Risk"} -->
<div class="card">
  <h3>Affiliate report</h3>
  <p class="sub">CSV with one row per partner or per sale. Needs a partner column and a revenue column. Payout and orders columns are optional. Rows for the same partner are summed.</p>
  <div id="drop"></div>
  <div class="field" style="margin-top:.6rem"><label for="paste">Or paste CSV</label><textarea id="paste" placeholder="partner,revenue,payout&#10;CouponSite,52000,5200"></textarea></div>
  <div class="row3"><div class="field"><label for="cp">Partner column</label><select id="cp"></select></div><div class="field"><label for="cr">Revenue column</label><select id="cr"></select></div><div class="field"><label for="cy">Payout column (optional)</label><select id="cy"></select></div></div>
  <div class="checks"><label><input type="checkbox" id="grp"> Group sub-IDs: treat names that share the text before a dash or underscore (AutoGuide-US, AutoGuide-CA) as one partner</label></div>
  <div class="actions"><button class="btn btn-primary" id="go" type="button">Analyze</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div>
  <div class="err" id="err"></div>
</div>
<div id="out"></div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, S = MT.stat, C = MT.chart; let tab = null;
function load(t) { tab = MT.readTable(t); const c = tab.cols; MT.fillSelect($('#cp'), c, /partner|affiliate|publisher|source|name|site|channel|network/i, { choose: true }); MT.fillSelect($('#cr'), c, /revenue|sales|sale amount|order value|gmv|donation|amount|income|turnover/i, { choose: true }); MT.fillSelect($('#cy'), c, /payout|commission|earning|cost|fee/i, { none: true }); if (!MT.guess(c, /payout|commission|earning|cost|fee/i)) $('#cy').value = ''; }
MT.dropzone($('#drop'), t => { $('#paste').value = t; load(t); }); $('#paste').addEventListener('input', MT.debounce(() => load($('#paste').value), 250));
$('#smp').addEventListener('click', () => { const r = MT.rng(5), rows = [['partner', 'revenue', 'payout']]; const big = [['CouponHub', 61000], ['DealFinder', 24000], ['BlogAlpha', 12000], ['ReviewPro', 8000]]; big.forEach(b => rows.push([b[0], b[1], (b[1] * (b[0] === 'CouponHub' ? 0.14 : 0.09)).toFixed(0)])); for (let i = 0; i < 46; i++) { const rev = Math.round(60 + Math.exp(r.n() * 0.9 + 5.2)); rows.push(['Partner_' + String(i + 1).padStart(2, '0'), rev, (rev * 0.09).toFixed(0)]); } const t = MT.toCSV(rows); $('#paste').value = t; load(t); run(); });
const normKey = n => String(n).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s,;.]+/g, ' ').trim();
const parentKey = n => { const m = String(n).match(/^(.{3,}?)\s*[-_:|\/]\s*\S.*$/); return m ? normKey(m[1]) : normKey(n); };
function run() {
  $('#err').textContent = ''; $('#out').innerHTML = ''; if (!tab) { $('#err').textContent = 'Paste or upload a report first.'; return; }
  const pc = $('#cp').value, rc = $('#cr').value, yc = $('#cy').value, grp = $('#grp').checked;
  if (!pc || !rc) { $('#err').textContent = 'Choose which columns hold the partner name and the revenue.'; return; }
  if (pc === rc) { $('#err').textContent = 'The partner column and the revenue column must be different.'; return; }
  const raw = tab.raw.slice(1), cur = (raw.map(r => r.join(' ')).join(' ').match(/[€£]/) || ['$'])[0], money = x => (x < 0 ? '-' : '') + cur + Math.abs(x).toLocaleString('en-US', { maximumFractionDigits: 0 });
  const m = new Map(); let blank = 0, blankRev = 0, bad = 0, badEx = [];
  tab.rows.forEach(r => {
    const nm = String(r[pc]).trim(), v = MT.num(r[rc]);
    if (!isFinite(v)) { if (nm || String(r[rc]).trim()) { bad++; if (badEx.length < 3) badEx.push(nm + ' / ' + r[rc]); } return; }
    if (!nm) { blank++; blankRev += v; return; }
    const k = grp ? parentKey(nm) : normKey(nm), o = m.get(k) || { rev: 0, pay: 0, names: new Map() }; o.rev += v; o.names.set(nm, (o.names.get(nm) || 0) + 1);
    if (yc) { const p = MT.num(r[yc]); if (isFinite(p)) o.pay += p; } m.set(k, o);
  });
  const all = Array.from(m, ([k, o]) => ({ key: k, name: Array.from(o.names).sort((a, b) => b[1] - a[1])[0][0], variants: o.names.size, rev: o.rev, pay: o.pay })), notes = [];
  const list = all.filter(x => x.rev > 0).sort((a, b) => b.rev - a.rev), gone = all.filter(x => x.rev <= 0), n = list.length;
  if (blank) notes.push(`${blank} row${blank === 1 ? '' : 's'} with no partner name left out (${money(blankRev)} of unattributed revenue). They are not in the shares below.`);
  if (bad) notes.push(`${bad} row${bad === 1 ? '' : 's'} with no readable revenue skipped (e.g. ${badEx.join(' | ')}).`);
  if (gone.length) notes.push(`${gone.length} partner${gone.length === 1 ? '' : 's'} with zero or negative net revenue left out of the shares (${gone.slice(0, 3).map(x => x.name + ' ' + money(x.rev)).join(', ')}). These have no sales, or reversals larger than sales.`);
  const merged = all.filter(x => x.variants > 1); if (merged.length && !grp) notes.push(`${merged.length} partner name${merged.length === 1 ? ' was' : 's were'} merged after ignoring case, accents and spacing (e.g. ${merged.slice(0, 3).map(x => x.name).join(', ')}).`);
  if (grp) notes.push('Names were grouped by the text before the first dash, underscore, colon or slash, so sub-IDs count as one partner.');
  const noteHtml = notes.length ? '<div class="note warn" role="note"><b>Data notes</b><ul>' + notes.map(t => '<li>' + MT.esc(t) + '</li>').join('') + '</ul></div>' : '';
  if (n < 1) { $('#out').innerHTML = MT.notComputed('Not computed', ['No partner has positive net revenue, so there is nothing to measure.']) + noteHtml; return; }
  const tot = S.sum(list.map(x => x.rev)), sh = list.map(x => x.rev / tot), hhi = S.sum(sh.map(s => (s * 100) ** 2)), eff = 10000 / hhi, cum = []; sh.reduce((a, s, i) => (cum[i] = a + s, a + s), 0);
  const EPS = 1e-9, top = k => Math.min(1, S.sum(sh.slice(0, k))), n80 = cum.findIndex(c => c >= 0.8 - EPS) + 1, n50 = cum.findIndex(c => c >= 0.5 - EPS) + 1, hhiMin = 10000 / n, small = n < 6;
  const asc = sh.slice().reverse(); let lor = [0], acc = 0; asc.forEach(s => { acc += s; lor.push(acc); }); let area = 0; for (let i = 1; i < lor.length; i++) area += (lor[i] + lor[i - 1]) / 2 / n; const gini = Math.max(0, 1 - 2 * area);
  // sub-ID check: names that share a prefix before a dash or underscore and add up to more than the top partner
  let sub = null; if (!grp) { const g = new Map(); list.forEach(x => { const k = parentKey(x.name); if (k === normKey(x.name)) return; const o = g.get(k) || { k, rev: 0, n: 0, ex: x.name.split(/\s*[-_:|\/]/)[0] }; o.rev += x.rev; o.n++; g.set(k, o); }); const big = Array.from(g.values()).filter(o => o.n >= 3 && o.rev / tot > sh[0] && o.rev / tot > 0.2).sort((a, b) => b.rev - a.rev)[0]; if (big) sub = big; }
  let level = small ? (sh[0] > 0.5 ? 'red' : 'yellow') : (hhi > 2500 || sh[0] > 0.3 ? 'red' : hhi > 1500 || sh[0] > 0.2 || top(3) > 0.6 + EPS ? 'yellow' : 'green');
  if (sub && level === 'green') level = 'yellow';
  const flags = []; if (sh[0] > 0.3) flags.push(`${list[0].name} alone provides ${F.pct(sh[0], 1)} of revenue.`); else if (sh[0] > 0.2) flags.push(`${list[0].name} provides ${F.pct(sh[0], 1)} of revenue.`);
  if (!small && top(3) > 0.6 + EPS) flags.push(`The top 3 partners provide ${F.pct(top(3), 0)}.`);
  if (sub) flags.push(`Possible sub-IDs: ${sub.n} partners start with "${sub.ex}" and together provide ${F.pct(sub.rev / tot, 1)} of revenue. If they belong to one company, concentration is much higher than shown. Tick "Group sub-IDs" and run again.`);
  if (n === 1) flags.push('One partner provides all of the positive revenue.'); else if (small) flags.push(`Only ${n} active partners, so HHI cannot go below ${F.int(hhiMin)} even when the split is perfectly even. Judge by how much one partner leaving would cost.`);
  else if (hhi > 2500) flags.push('HHI is above 2,500, the conventional threshold for a highly concentrated market.'); else if (hhi > 1500) flags.push('HHI is in the moderately concentrated band (1,500 to 2,500).');
  if (level === 'red' && !small && hhi <= 2500) flags.push('The banner is red because the largest partner is above 30%, even though HHI alone is not high.');
  if (!flags.length) flags.push('Revenue is spread across many partners.');
  let h = MT.rag(level, level === 'red' ? 'High concentration risk' : level === 'yellow' ? (small ? 'Small program: every partner matters' : 'Moderate concentration risk') : 'Low concentration risk', flags) + noteHtml;
  h += MT.stats([['HHI', F.int(hhi), 'scale 0 to 10,000', level === 'red' ? 'bad' : level === 'yellow' ? 'warn' : 'good'], ['Effective number of partners', eff.toFixed(1), `of ${n} active (equal split: HHI ${F.int(hhiMin)})`], ['Top partner share', F.pct(sh[0], 1), list[0].name], ['Top 5 share', n <= 5 ? (n === 1 ? 'The only partner' : 'All ' + n + ' partners') : F.pct(top(5), 1), n <= 5 ? '' : n <= 10 ? 'Top 10 is all ' + n + ' partners' : 'Top 10: ' + F.pct(top(10), 1)], [`Partners for 80% of revenue`, `${n80} (${F.pct(n80 / n, 0)})`, `50% needs ${n50}`], ['Gini coefficient', gini.toFixed(2), '0 = equal, 1 = one partner']]);
  h += '<div class="card"><h3>Loss scenarios</h3>' + MT.tbl(['If you lose', 'Revenue at risk', 'Remaining revenue'], [1, 3, 5].filter(k => k < n).map(k => [k === 1 ? list[0].name : `Top ${k} partners`, money(S.sum(list.slice(0, k).map(x => x.rev))) + ' (' + F.pct(top(k), 1) + ')', money(tot - S.sum(list.slice(0, k).map(x => x.rev)))]), { num: [1, 2] }) + '<p class="sub">Gross revenue, not profit. A partner with a high payout costs more margin than the revenue share suggests.</p></div>';
  h += '<div class="card"><div id="c1"></div><div id="c2"></div></div>';
  const rows = list.slice(0, 25).map((x, i) => { const r = [i + 1, x.name, money(x.rev), F.pct(sh[i], 1), F.pct(cum[i], 1)]; if (yc) { const ps = x.pay / x.rev; r.push(F.pct(ps, 1)); } return r; });
  h += '<div class="card"><h3>Top partners</h3>' + MT.tbl(['#', 'Partner', 'Revenue', 'Share', 'Cumulative', ...(yc ? ['Payout / revenue'] : [])], rows, { num: [0, 2, 3, 4, 5] }) + '</div>';
  if (yc) { const avg = S.sum(list.map(x => x.pay)) / tot, hi = list.filter(x => x.pay / x.rev > avg * 1.4).sort((a, b) => b.pay / b.rev - a.pay / a.rev).slice(0, 5); if (hi.length) h += MT.note('<b>Payout outliers.</b> These partners cost noticeably more per revenue unit than the program average of ' + F.pct(avg, 1) + ': ' + hi.map(x => MT.esc(x.name) + ' (' + F.pct(x.pay / x.rev, 1) + ')').join(', ') + '.', 'warn'); }
  h += MT.note('<b>Benchmarks.</b> The HHI bands (under 1,500 unconcentrated, 1,500 to 2,500 moderate, above 2,500 high) come from the 2010 US antitrust guidelines, and the 2023 guidelines put the high line at 1,800. They are borrowed from competition law, not affiliate norms, so treat them as a rough guide. No single partner above 20% and top 3 under 50% is a common diversification target for affiliate programs. This tool measures revenue only: it does not know which partners are incremental, under contract or profitable.');
  $('#out').innerHTML = h;
  C.hbars($('#c1'), { title: 'Revenue share, top 15 partners', cats: list.slice(0, 15).map(x => x.name), values: sh.slice(0, 15).map(s => s * 100), fmt: v => v.toFixed(1) + '%' });
  C.line($('#c2'), { title: 'Lorenz curve: cumulative revenue share vs cumulative partner share', xs: lor.map((_, i) => i / n * 100), xFmt: v => v.toFixed(0) + '%', yFmt: v => (v * 100).toFixed(0) + '%', series: [{ name: 'Actual', values: lor, color: 'var(--series-1)' }, { name: 'Perfect equality', values: lor.map((_, i) => i / n), color: 'var(--ink-muted)', dash: '4 3' }], table: false });
}
$('#go').addEventListener('click', run);
})();
</script>
