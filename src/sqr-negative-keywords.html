<!--META {"title":"Search Query Report Bleed & Negative Keyword Extractor","short":"Turn a search terms report into ready-to-paste exact and phrase negative keywords with the spend they stop.","desc":"Upload a Google or Microsoft Ads search terms report. The tool finds wasted spend from broad and phrase match expansion, mines n-gram patterns, and outputs negative keyword lists by match type.","tag":"Paid search"} -->
<div class="card">
  <h3>Search terms report</h3>
  <p class="sub">Export from Google Ads (Campaigns, Insights and reports, Search terms) or Microsoft Ads. Title lines above the column names are skipped, and French exports are read. Choose any column the tool could not recognise.</p>
  <div id="drop"></div>
  <div class="field" style="margin-top:.6rem"><label for="paste">Or paste CSV</label><textarea id="paste" placeholder="Search term,Clicks,Impr.,Cost,Conversions"></textarea></div>
  <div class="row3"><div class="field"><label for="ct">Search term column</label><select id="ct"></select></div><div class="field"><label for="cc">Clicks</label><select id="cc"></select></div><div class="field"><label for="ci">Impressions</label><select id="ci"></select></div></div>
  <div class="row3"><div class="field"><label for="cs">Cost</label><select id="cs"></select></div><div class="field"><label for="cv">Conversions</label><select id="cv"></select></div><div class="field"><label for="cx">Added/Excluded (optional)</label><select id="cx"></select></div></div>
  <div class="row3"><div class="field"><label>N-gram sizes</label><div class="checks"><label><input type="checkbox" class="ng" value="1" checked> 1 word</label><label><input type="checkbox" class="ng" value="2" checked> 2 words</label><label><input type="checkbox" class="ng" value="3" checked> 3 words</label></div></div></div>
</div>
<div class="card"><h3>Thresholds</h3><div id="f"></div>
  <div class="row2"><div class="field"><label for="f_prot">Protected terms (never negate)</label><textarea id="f_prot" placeholder="Your product and brand words, one per line or comma separated"></textarea></div><div class="field"><label for="mods">Irrelevant intent modifiers</label><textarea id="mods">free
jobs
job
careers
salary
diy
torrent
download
pdf
template
wiki
definition
meaning
repair
manual
login</textarea></div></div>
  <div class="actions"><button class="btn btn-primary" id="go" type="button">Find negatives</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div><div class="err" id="err"></div></div>
<div id="out"></div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, S = MT.stat, C = MT.chart; let tab = null, preLines = 0;
MT.fields($('#f'), [{ id: 'spend', label: 'Exact negative: zero conversions and spend at least ($)', value: 50 }, { id: 'clk', label: '...or clicks at least', value: 30 }, { id: 'ctr', label: 'Low CTR below (%)', value: 1 }, { id: 'imp', label: '...with impressions at least', value: 500 }, { id: 'ngc', label: 'Phrase negative: n-gram cost at least ($)', value: 40 }, { id: 'ngt', label: '...seen in at least this many distinct terms', value: 2 }, { id: 'luck', label: 'Count zero conversions as evidence only if the chance of it happening by luck is below (%)', value: 10 }], 'g3');
const FR_STOP = new Set('les des une aux avec dans pour par sur sous chez vers est sont et ou ni mais donc que qui quoi dont ses ces mes tes nos vos leur leurs the and for with'.split(' '));
const AGG = /^(other search terms|autres termes de recherche|autres requ[êe]tes|--+|n\/a)$/i;
/* Drop title lines above the header: the header is the first line with at least 3 cells (comma, semicolon or tab separated). */
function trimPreamble(t) { const L = t.replace(/^﻿/, '').split(/\r?\n/); let k = L.findIndex(l0 => { const l = l0.replace(/"[^"]*"/g, ''); return Math.max((l.match(/,/g) || []).length, (l.match(/;/g) || []).length, (l.match(/\t/g) || []).length) >= 2; }); if (k < 0) k = 0; preLines = L.slice(0, k).filter(l => l.trim()).length; return L.slice(k).join('\n'); }
function load(t) { tab = MT.readTable(trimPreamble(t)); const c = tab.cols, o = { choose: true }; MT.fillSelect($('#ct'), c, /search term|query|keyword/i, o); MT.fillSelect($("#cc"), c, /^clicks?$|\bclicks\b/i, o); MT.fillSelect($('#ci'), c, /impr/i, { none: true }); MT.fillSelect($('#cs'), c, /^cost|spend/i, o); MT.fillSelect($('#cv'), c, /^conv(ersions?)?\.?$|^conversions/i, o); MT.fillSelect($('#cx'), c, /added.?excluded|ajout|exclu|^status|^statut/i, { none: true }); }
MT.dropzone($('#drop'), t => { $('#paste').value = t; load(t); }); $('#paste').addEventListener('input', MT.debounce(() => load($('#paste').value), 250));
$('#smp').addEventListener('click', () => { const r = MT.rng(11), rows = [['Search term', 'Clicks', 'Impr.', 'Cost', 'Conversions']]; const good = ['crm software', 'best crm for small business', 'crm software pricing', 'sales crm tool', 'crm for startups'], bad = ['free crm software download', 'crm jobs', 'crm salary', 'crm training pdf', 'what is crm definition', 'crm login', 'free crm template excel', 'crm developer jobs remote', 'crm repair manual', 'hubspot login page']; good.forEach(g => { const c = 30 + Math.round(r.u() * 60); rows.push([g, c, c * 12, '$' + (c * 3.1).toFixed(2), Math.round(c * 0.09)]); }); bad.forEach(g => { const c = 10 + Math.round(r.u() * 50); rows.push([g, c, c * 20, '$' + (c * 2.6).toFixed(2), 0]); }); for (let i = 0; i < 25; i++) { const c = 1 + Math.round(r.u() * 8); rows.push(['crm query ' + (i + 1), c, c * 15, '$' + (c * 2.9).toFixed(2), r.u() < 0.2 ? 1 : 0]); } const t = MT.toCSV(rows); $('#paste').value = t; load(t); MT.$('#f_prot').value = 'crm'; run(); });
/* Unicode-aware tokens: NFC, curly apostrophes straightened, French elisions (l', d', qu') dropped, letters from any script. */
const words = s => (s.toLowerCase().normalize('NFC').replace(/[’‘]/g, "'").replace(/(^|[^\p{L}\p{N}])(?:[ldnsjmtc]|qu)'(?=\p{L})/gu, '$1').match(/[\p{L}\p{N}]+(?:[\-'][\p{L}\p{N}]+)*/gu) || []);
const hasSeq = (w, p) => { if (!p.length) return false; for (let i = 0; i + p.length <= w.length; i++) { let ok = true; for (let j = 0; j < p.length; j++) if (w[i + j] !== p[j]) { ok = false; break; } if (ok) return true; } return false; };
function run() {
  $('#err').textContent = ''; if (!tab) { $('#err').textContent = 'Paste or upload a report first.'; return; }
  const t = $('#ct').value, cc = $('#cc').value, ci = $('#ci').value, cs = $('#cs').value, cv = $('#cv').value, cx = $('#cx').value, notes = [];
  const missing = [['search term', t], ['clicks', cc], ['cost', cs], ['conversions', cv]].filter(x => !x[1]).map(x => x[0]);
  if (missing.length) { $('#out').innerHTML = MT.notComputed('Choose the columns first', ['Nothing was calculated because these columns are not mapped: ' + missing.join(', ') + '. Pick them in the lists above, then run again.']); return; }
  if (preLines) notes.push(preLines + ' title line' + (preLines === 1 ? '' : 's') + ' above the column names ignored.');
  const nan = { cost: 0, clicks: 0, conv: 0 }, norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  const colN = c => MT.numFmt(tab.rows.map(r => r[c])), fm = { cc: colN(cc), cs: colN(cs), cv: colN(cv), ci: ci ? colN(ci) : 'us' };
  const parsed = [], excl = []; let noTerm = 0; const aggRows = [];
  tab.rows.forEach(r => {
    const term = norm(r[t]); if (!term) { noTerm++; return; } if (/^total/.test(term) || term.startsWith('--')) return;
    if (AGG.test(term)) { aggRows.push(term + ' (' + F.money(MT.num(r[cs], fm.cs) || 0, 2) + ')'); return; }
    const num = (c, f, k) => { const v = MT.num(r[c], f); if (!isFinite(v)) { if (String(r[c]).trim() !== '' && !/^(--|n\/a|na)$/i.test(String(r[c]).trim())) nan[k]++; return 0; } return v; };
    const o = { term, clicks: num(cc, fm.cc, 'clicks'), impr: ci ? num(ci, fm.ci, 'clicks') : 0, cost: num(cs, fm.cs, 'cost'), conv: num(cv, fm.cv, 'conv'), added: false };
    const st = cx ? norm(r[cx]) : ''; if (/^(excluded|exclu)/.test(st)) { excl.push(o); return; } if (/^(added|ajout)/.test(st)) o.added = true;
    parsed.push(o);
  });
  /* merge the same term appearing in several campaigns */
  const m = new Map(); let merged = 0; parsed.forEach(r => { const o = m.get(r.term); if (o) { o.clicks += r.clicks; o.impr += r.impr; o.cost += r.cost; o.conv += r.conv; o.added = o.added || r.added; merged++; } else m.set(r.term, Object.assign({}, r)); });
  const rows = Array.from(m.values()); rows.forEach(r => r.w = words(r.term));
  if (noTerm) notes.push(noTerm + ' row' + (noTerm === 1 ? '' : 's') + ' with an empty search term skipped.');
  if (aggRows.length) notes.push(aggRows.length + ' aggregate row' + (aggRows.length === 1 ? '' : 's') + ' left out because they are buckets, not search terms: ' + aggRows.slice(0, 3).join('; ') + '.');
  if (excl.length) notes.push(excl.length + ' term' + (excl.length === 1 ? ' is' : 's are') + ' already Excluded (' + F.money(S.sum(excl.map(r => r.cost)), 2) + ') and left out of every total and saving.');
  if (merged) notes.push(merged + ' repeated search term row' + (merged === 1 ? '' : 's') + ' (same term in another campaign) merged into one.');
  const nb = nan.cost + nan.clicks + nan.conv; if (nb) notes.push(nb + ' cell' + (nb === 1 ? '' : 's') + ' in the cost, clicks or conversions columns could not be read as numbers and counted as 0. Check the column mapping.');
  const addedN = rows.filter(r => r.added).length; if (addedN) notes.push(addedN + ' term' + (addedN === 1 ? ' is' : 's are') + ' already Added as your own keywords, so they are never proposed as negatives and no phrase negative that would block them is proposed.');
  const noteHtml = () => notes.length ? '<div class="note warn" role="note"><b>Data notes</b><ul>' + notes.map(n => '<li>' + MT.esc(n) + '</li>').join('') + '</ul></div>' : '';
  if (!rows.length) { $('#out').innerHTML = MT.notComputed('No search terms read', ['No usable rows after skipping totals and aggregates. Check that the search term column is mapped correctly.']) + noteHtml(); return; }
  const totalCost = S.sum(rows.map(r => r.cost)), totalClk = S.sum(rows.map(r => r.clicks)), totalConv = S.sum(rows.map(r => r.conv));
  if (totalCost <= 0) { $('#out').innerHTML = MT.notComputed('No spend found', ['The cost column added up to zero, so there is nothing to analyse. Check the Cost column mapping and number format.']) + noteHtml(); return; }
  if (totalConv <= 0 || totalClk <= 0) { $('#out').innerHTML = MT.notComputed('No conversions in this report', ['Without any conversions, a zero-conversion term is not evidence of waste, so no negatives are proposed. Check the Conversions column mapping, or use a longer date range.']) + noteHtml(); return; }
  const cvr = totalConv / totalClk, luck = MT.f('luck') / 100, pZero = c => Math.pow(1 - Math.min(cvr, 0.999999), c), enough = c => pZero(c) <= luck;
  const prot = MT.$('#f_prot').value.toLowerCase().split(/[\n,]+/).map(s => s.trim()).filter(Boolean).map(s => ({ s, w: words(s) })).filter(p => p.w.length);
  const isProt = r => r.added || prot.some(p => hasSeq(r.w, p.w)), protName = r => r.added ? 'your own keyword' : 'protected "' + prot.find(p => hasSeq(r.w, p.w)).s + '"';
  const sp = MT.f('spend'), mc = MT.f('clk'), ctrMax = MT.f('ctr') / 100, mi = MT.f('imp'), ngc = MT.f('ngc'), ngt = MT.f('ngt');
  const mods = MT.$('#mods').value.toLowerCase().split(/[\n,]+/).map(s => s.trim()).filter(Boolean).map(s => ({ s, w: words(s) })).filter(p => p.w.length), sizes = MT.$$('.ng:checked').map(x => +x.value);
  const ng = new Map(); rows.forEach(r => { sizes.forEach(n => { const seen = new Set(); for (let i = 0; i + n <= r.w.length; i++) { const gw = r.w.slice(i, i + n), g = gw.join(' '); if (seen.has(g)) continue; seen.add(g); if (n === 1 && (MT.stop.has(g) || FR_STOP.has(g) || g.length < 3 || /^\d+$/.test(g))) continue; const o = ng.get(g) || { g, gw, n, rows: [] }; o.rows.push(r); ng.set(g, o); } }); });
  const phrases = [], held = [];
  const summ = rs => ({ cost: S.sum(rs.map(r => r.cost)), clicks: S.sum(rs.map(r => r.clicks)), conv: S.sum(rs.map(r => r.conv)), terms: rs.length });
  const convWords = new Set(); rows.filter(r => r.conv > 0).forEach(r => r.w.forEach(x => convWords.add(x)));
  ng.forEach(o => { const s = summ(o.rows); if (s.conv > 0 || s.cost < ngc || s.terms < ngt || !enough(s.clicks)) return; if (o.n === 1) { const kin = Array.from(convWords).find(x => x !== o.g && x.length >= 4 && o.g.length >= 4 && (x.startsWith(o.g) || o.g.startsWith(x))); if (kin) { held.push({ g: o.g, gw: o.gw, cost: s.cost, why: 'Close variant of "' + kin + '", a word in your converting terms. Phrase match could block it.' }); return; } } const bad = o.rows.filter(isProt); if (bad.length) { held.push({ g: o.g, gw: o.gw, cost: s.cost, why: 'Would also block ' + protName(bad[0]) + ' term "' + bad[0].term + '" (' + F.money(bad[0].cost, 2) + ')' + (bad.length > 1 ? ' and ' + (bad.length - 1) + ' more' : '') + '.' }); return; } phrases.push({ g: o.g, gw: o.gw, cost: s.cost, clicks: s.clicks, terms: s.terms, why: 'Zero conversions across ' + s.terms + ' distinct terms' }); });
  mods.forEach(mo => { const hit = rows.filter(r => hasSeq(r.w, mo.w)); if (!hit.length || phrases.some(p => p.g === mo.w.join(' '))) return; const s = summ(hit), conv = hit.filter(r => r.conv > 0), bad = hit.filter(isProt);
    if (conv.length) { held.push({ g: mo.s, gw: mo.w, cost: s.cost, why: 'Terms containing it converted (' + F.int(conv.reduce((a, r) => a + r.conv, 0)) + ' conversions on ' + conv.length + ' term' + (conv.length === 1 ? '' : 's') + ', ' + F.money(S.sum(conv.map(r => r.cost)), 2) + '). It may be what you sell.' }); return; }
    if (bad.length) { held.push({ g: mo.s, gw: mo.w, cost: s.cost, why: 'Would also block ' + protName(bad[0]) + ' term "' + bad[0].term + '" (' + F.money(bad[0].cost, 2) + ').' }); return; }
    if (s.cost <= 0) return; phrases.push({ g: mo.s, gw: mo.w, cost: s.cost, clicks: s.clicks, terms: s.terms, why: 'Intent word from your list; no matching term converted' }); });
  /* a phrase negative that contains a shorter listed phrase adds nothing: the shorter one already blocks it */
  const kept = phrases.filter(p => !phrases.some(q => q !== p && q.gw.length < p.gw.length && hasSeq(p.gw, q.gw)));
  const sig = p => rows.filter(r => hasSeq(r.w, p.gw)).map(r => r.term).sort().join('|'), seenSig = new Set();
  kept.sort((a, b) => a.gw.length - b.gw.length || a.g.length - b.g.length); for (let i = 0; i < kept.length; i++) { const k = sig(kept[i]); if (seenSig.has(k)) { kept.splice(i, 1); i--; } else seenSig.add(k); }
  const pruned = phrases.length - kept.length; phrases.length = 0; kept.forEach(p => phrases.push(p)); phrases.sort((a, b) => b.cost - a.cost);
  if (pruned) notes.push(pruned + ' longer phrase negative' + (pruned === 1 ? '' : 's') + ' not listed because a shorter listed phrase already blocks the same searches.');
  const covered = r => phrases.some(p => hasSeq(r.w, p.gw));
  const zeroRows = rows.filter(r => r.conv === 0 && !isProt(r));
  const money = r => (r.cost >= sp || r.clicks >= mc), lowCtr = r => r.impr >= mi && r.impr > 0 && r.clicks / r.impr < ctrMax;
  const exact = zeroRows.filter(r => (money(r) && enough(r.clicks)) || lowCtr(r)).sort((a, b) => b.cost - a.cost), exactOnly = exact.filter(r => !covered(r));
  const unsure = zeroRows.filter(r => money(r) && !enough(r.clicks) && !lowCtr(r) && !covered(r)).sort((a, b) => b.cost - a.cost);
  const phraseSave = S.sum(rows.filter(r => covered(r) && r.conv === 0).map(r => r.cost)), exactSave = S.sum(exactOnly.map(r => r.cost)), save = phraseSave + exactSave;
  const zero = S.sum(rows.filter(r => r.conv === 0).map(r => r.cost)), found = phrases.length + exactOnly.length;
  const need = cvr > 0 ? Math.ceil(Math.log(luck) / Math.log(1 - Math.min(cvr, 0.999999))) : 0;
  let h = found ? MT.verdict(save / totalCost > 0.15 ? 'neg' : 'neu', `${F.money(save, 0)} of past spend sits on terms these negatives would block (${F.pct(save / Math.max(totalCost, 1), 1)} of ${F.money(totalCost, 0)})`, `${phrases.length} phrase negatives and ${exactOnly.length} exact negatives found. Zero-conversion terms account for ${F.money(zero, 0)} in total. This is past spend: some of it moves to other queries instead of disappearing, so read every line before adding it.`) : MT.verdict('neu', 'No negatives have enough evidence at these settings', `Zero-conversion terms account for ${F.money(zero, 0)}, but none clears the evidence and protection checks below. Nothing here should be added as a negative yet.`);
  h += '<p class="sub">The average term in this report converts at ' + F.pct(cvr, 2) + ' of clicks. A term with zero conversions counts as evidence only when the chance of that happening by luck is under ' + F.pct(luck, 0) + ', which takes about ' + F.int(need) + ' clicks at this rate.</p>';
  h += MT.stats([['Total spend', F.money(totalCost, 0), F.int(rows.length) + ' search terms'], ['Zero-conversion spend', F.money(zero, 0), F.pct(zero / Math.max(totalCost, 1), 0) + ' of spend'], ['Phrase negatives', String(phrases.length), F.money(phraseSave, 0) + ' past spend'], ['Exact negatives', String(exactOnly.length), F.money(exactSave, 0) + ' past spend']]);
  h += noteHtml();
  const pl = phrases.map(p => '"' + p.g + '"'), el = exactOnly.map(r => '[' + r.term + ']');
  h += '<div class="card"><h3>Phrase-match negatives</h3>' + (phrases.length ? MT.tbl(['Negative', 'Cost', 'Clicks', 'Terms', 'Reason'], phrases.map(p => ['"' + p.g + '"', F.money(p.cost, 2), F.int(p.clicks), p.terms, p.why]), { num: [1, 2, 3] }) + '<div class="actions"><button class="btn btn-secondary btn-sm" data-c="p" type="button">Copy phrase list</button></div>' : '<p class="muted">None found at these thresholds.</p>') + '</div>';
  h += '<div class="card"><h3>Exact-match negatives</h3><p class="sub">Terms not already covered by a phrase negative above.</p>' + (exactOnly.length ? MT.tbl(['Negative', 'Cost', 'Clicks', 'Impressions', 'Conversions', 'Chance of 0 by luck'], exactOnly.map(r => ['[' + r.term + ']', F.money(r.cost, 2), F.int(r.clicks), F.int(r.impr), r.conv, F.pct(pZero(r.clicks), 0)]), { num: [1, 2, 3, 4, 5] }) + '<div class="actions"><button class="btn btn-secondary btn-sm" data-c="e" type="button">Copy exact list</button><button class="btn btn-secondary btn-sm" data-c="a" type="button">Copy all</button><button class="btn btn-secondary btn-sm" id="dl" type="button">Download CSV</button></div>' : '<p class="muted">None found at these thresholds.</p>') + '</div>';
  const hd = []; held.forEach(x => { if (!hd.some(y => y.g === x.g)) hd.push(x); }); held.length = 0; hd.forEach(x => held.push(x));
  if (held.length) h += '<div class="card"><h3>Held back: would block terms you want</h3><p class="sub">These looked like waste but would also block a converting, protected or Added term. Not in the copy lists.</p>' + MT.tbl(['Phrase', 'Cost', 'Why held back'], held.sort((a, b) => b.cost - a.cost).map(x => ['"' + x.g + '"', F.money(x.cost, 2), x.why]), { num: [1] }) + '</div>';
  if (unsure.length) h += '<div class="card"><h3>Zero conversions, not enough evidence</h3><p class="sub">' + unsure.length + ' terms (' + F.money(S.sum(unsure.map(r => r.cost)), 0) + ') have no conversions, but at this click volume that is normal. Do not negate them on this evidence alone.</p>' + MT.tbl(['Term', 'Cost', 'Clicks', 'Chance of 0 by luck'], unsure.slice(0, 15).map(r => [r.term, F.money(r.cost, 2), F.int(r.clicks), F.pct(pZero(r.clicks), 0)]), { num: [1, 2, 3] }) + (unsure.length > 15 ? '<p class="sub">Showing 15 of ' + unsure.length + '.</p>' : '') + '</div>';
  if (prot.length) h += MT.note('<b>Protected terms</b> (' + MT.esc(prot.map(p => p.s).join(', ')) + '): no listed negative contains one, and no listed phrase negative would block a term that does.' + (held.length ? ' Phrases that would are under "Held back".' : ''));
  h += '<div class="card"><div id="c1"></div></div>'; $('#out').innerHTML = h;
  C.hbars($('#c1'), { title: 'Cost by suggested phrase negative, top 12', cats: phrases.slice(0, 12).map(p => '"' + p.g + '"'), values: phrases.slice(0, 12).map(p => p.cost), fmt: v => F.money(v, 0) });
  const lists = { p: pl.join('\n'), e: el.join('\n'), a: pl.concat(el).join('\n') };
  MT.$$('[data-c]').forEach(b => b.addEventListener('click', e => MT.copy(lists[b.dataset.c], e.target)));
  const dl = $('#dl'); if (dl) dl.addEventListener('click', () => MT.download('negative-keywords.csv', MT.toCSV([['keyword', 'match_type', 'criterion_type', 'past_cost']].concat(phrases.map(p => [p.g, 'phrase', 'Negative Phrase', p.cost.toFixed(2)]), exactOnly.map(r => [r.term, 'exact', 'Negative Exact', r.cost.toFixed(2)]))), 'text/csv'));
}
$('#go').addEventListener('click', run);
})();
</script>
