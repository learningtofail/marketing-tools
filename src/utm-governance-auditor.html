<!--META {"title":"UTM Governance Auditor","short":"Find inconsistent UTM naming, case splits and missing parameters that fragment your channel reporting.","desc":"Paste campaign URLs, a landing-page export or a source / medium report. The tool validates UTM parameters against your naming convention, detects case, spelling and synonym variants that split channels, and lists rows to fix with a suggested correction.","tag":"Data governance"} -->
<div class="card"><h3>Input</h3>

  <div id="drop"></div>
  <div class="field" style="margin-top:.6rem"><label for="paste">URLs or CSV</label><textarea id="paste" rows="7" placeholder="https://example.com/?utm_source=Facebook&utm_medium=cpc&utm_campaign=Summer_Sale"></textarea></div>
  <div id="colbox" class="row2" style="display:none"><div class="field"><label for="cu">URL or source / medium column</label><select id="cu"></select></div><div class="field"><label for="cs">Sessions column (optional)</label><select id="cs"></select></div></div>
</div>
<div class="card"><h3>Naming convention</h3><div id="f"></div>
  <div class="row2"><div class="field"><label for="f_srcs">Approved sources (comma separated, blank to skip)</label><textarea id="f_srcs" rows="2">google, facebook, instagram, linkedin, tiktok, bing, youtube, newsletter, x, reddit</textarea></div><div class="field"><label for="f_meds">Approved mediums</label><textarea id="f_meds" rows="2">cpc, paid_social, email, organic_social, display, affiliate, referral, video, sms</textarea></div></div>
  <div class="actions"><button class="btn btn-primary" id="go" type="button">Audit</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div><div class="err" id="err"></div></div>
<div id="out"></div>
