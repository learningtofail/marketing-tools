<!--META {"title":"Promotional Capacity Sanity-Checker","short":"Green, yellow or red score for a planned discount: margin, warehouse strain and support load.","desc":"Check a planned discount or flash sale before committing to launch dates. See contribution margin compression, break-even volume lift, warehouse and support utilization, and pull-forward cost.","tag":"Planning"} -->
<div class="split">
  <div>
    <div class="card"><h3>Unit economics</h3><div id="f1"></div></div>
    <div class="card"><h3>Promotion</h3><div id="f2"></div></div>
    <div class="card"><h3>Operations</h3><div id="f3"></div></div>
  </div>
  <div id="out" class="out"></div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, C = MT.chart;
MT.fields($('#f1'), [{ id: 'price', label: 'Regular price ($)', value: 60 }, { id: 'cogs', label: 'COGS per order ($)', value: 21 }, { id: 'ship', label: 'Shipping per order ($)', value: 6 }, { id: 'pick', label: 'Pick and pack per order ($)', value: 2.5 }, { id: 'fee', label: 'Payment fee (%)', value: 2.9 }, { id: 'base', label: 'Baseline orders per day', value: 150 }], 'g2');
MT.fields($('#f2'), [{ id: 'disc', label: 'Discount (%)', value: 30 }, { id: 'mult', label: 'Expected order volume multiple', value: 2.5, hint: '2.5 means 2.5 times baseline orders.' }, { id: 'days', label: 'Promo duration (days)', value: 4 }, { id: 'mkt', label: 'Extra marketing cost ($)', value: 6000 }, { id: 'pull', label: 'Pull-forward (% of extra orders taken from later weeks)', value: 30 }, { id: 'ret', label: 'Return rate during promo (%)', value: 14 }, { id: 'ret0', label: 'Baseline return rate (%)', value: 9 }], 'g2');
MT.fields($('#f3'), [{ id: 'wh', label: 'Max orders shipped per day', value: 420 }, { id: 'tk', label: 'Support tickets per 100 orders (baseline)', value: 7 }, { id: 'tkm', label: 'Ticket rate multiple during promo', value: 1.4 }, { id: 'tkc', label: 'Cost per ticket ($)', value: 4.5 }, { id: 'sc', label: 'Support capacity (tickets per day)', value: 55 }], 'g2');
function calc(o) {
  const disc = o.disc / 100, pp = o.price * (1 - disc);
  const mBase = o.price * (1 - o.ret0 / 100) - o.cogs * 1 - o.ship - o.pick - o.price * o.fee / 100 - o.tk / 100 * o.tkc;
  const mPromo = pp * (1 - o.ret / 100) - o.cogs - o.ship - o.pick - pp * o.fee / 100 - o.tk * o.tkm / 100 * o.tkc;
  const orders = o.base * o.mult, baseTot = o.base * o.days * mBase, promoTot = orders * o.days * mPromo - o.mkt, pullLoss = o.pull / 100 * (orders - o.base) * o.days * mBase;
  return { mBase, mPromo, orders, baseTot, promoTot, pullLoss, incr: promoTot - baseTot - pullLoss };
}
function run() {
  const o = {}; ['price', 'cogs', 'ship', 'pick', 'fee', 'base', 'disc', 'mult', 'days', 'mkt', 'pull', 'ret', 'ret0', 'wh', 'tk', 'tkm', 'tkc', 'sc'].forEach(k => o[k] = MT.f(k));
  const r = calc(o), utilW = r.orders / o.wh, tickets = r.orders * o.tk * o.tkm / 100, utilS = tickets / o.sc, compress = 1 - r.mPromo / r.mBase;
  const den = o.base * o.days * (r.mPromo - o.pull / 100 * r.mBase), kStar = den > 0 ? (o.mkt + o.base * o.days * r.mBase * (1 - o.pull / 100)) / den : Infinity;
  const red = [], yel = [];
  if (r.mPromo < 0) red.push(`Each promo order loses ${F.money(-r.mPromo, 2)}.`); if (r.incr < 0) red.push(`The promotion destroys ${F.money(-r.incr, 0)} of contribution versus not running it.`); else if (r.incr < 0.2 * Math.max(1, r.baseTot)) yel.push(`Incremental contribution of ${F.money(r.incr, 0)} is thin against a baseline of ${F.money(r.baseTot, 0)}.`);
  if (utilW > 1) red.push(`Warehouse demand is ${F.pct(utilW, 0)} of daily shipping capacity.`); else if (utilW > 0.8) yel.push(`Warehouse runs at ${F.pct(utilW, 0)} of capacity.`);
  if (utilS > 1) red.push(`Support demand is ${F.pct(utilS, 0)} of daily ticket capacity.`); else if (utilS > 0.8) yel.push(`Support runs at ${F.pct(utilS, 0)} of capacity.`);
  if (compress > 0.5 && r.mPromo >= 0) yel.push(`Margin per order falls ${F.pct(compress, 0)}.`); if (o.mult < kStar && isFinite(kStar)) (r.incr < 0 ? red : yel).push(`You need ${kStar.toFixed(2)}x volume to break even and are planning ${o.mult}x.`);
  const level = red.length ? 'red' : yel.length ? 'yellow' : 'green', reasons = red.concat(yel); if (!reasons.length) reasons.push('Margin, warehouse and support all stay within safe limits.');
  let h = MT.rag(level, level === 'red' ? 'Red: do not launch as planned' : level === 'yellow' ? 'Yellow: launch only with mitigations' : 'Green: viable as planned', reasons);
  h += MT.stats([['Margin per order', `${F.money(r.mBase, 2)} to ${F.money(r.mPromo, 2)}`, 'compression ' + F.pct(compress, 0), r.mPromo > 0 ? '' : 'bad'], ['Incremental contribution', F.money(r.incr, 0), 'after marketing and pull-forward', r.incr >= 0 ? 'good' : 'bad'], ['Break-even volume multiple', isFinite(kStar) ? kStar.toFixed(2) + 'x' : 'unreachable', 'planned ' + o.mult + 'x'], ['Warehouse utilization', F.pct(utilW, 0), F.int(r.orders) + ' of ' + F.int(o.wh) + ' orders/day', MT.tone(utilW, 0.8, 1, true)], ['Support utilization', F.pct(utilS, 0), F.int(tickets) + ' of ' + F.int(o.sc) + ' tickets/day', MT.tone(utilS, 0.8, 1, true)], ['Pull-forward cost', F.money(r.pullLoss, 0), F.pct(o.pull / 100, 0) + ' of extra orders']]);
  h += '<div class="card"><div id="ch"></div></div>';
  const discs = [10, 15, 20, 25, 30, 40, 50], mults = [1.5, 2, 2.5, 3, 4, 5];
  h += '<div class="card"><h3>Incremental contribution: discount vs volume multiple</h3><p class="sub">Green is above zero, amber is up to 20% of baseline contribution, red is a loss. Other inputs as entered.</p>' + MT.tbl(['Discount \\ Volume'].concat(mults.map(m => m + 'x')), discs.map(d => [d + '%'].concat(mults.map(m => { const x = calc(Object.assign({}, o, { disc: d, mult: m })).incr, t = x < 0 ? 'bad' : x < 0.2 * Math.max(1, r.baseTot) ? 'warn' : 'good'; return { h: `<span style="display:block;padding:.15rem .3rem;${MT.cellTone(t)}">${F.money(x, 0)}</span>`, cls: 'c' }; }))), { cls: 'heat' }) + '</div>';
  $('#out').innerHTML = h;
  C.bars($('#ch'), { title: 'Contribution over the promo window', cats: ['Baseline (no promo)', 'Promo, gross', 'Promo, net of pull-forward'], series: [{ name: 'Contribution ($)', values: [r.baseTot, r.promoTot, r.promoTot - r.pullLoss], color: 'var(--series-1)' }], yFmt: v => F.money(v, 0) });
}
MT.live(document.querySelector('.split'), run);
})();
</script>
