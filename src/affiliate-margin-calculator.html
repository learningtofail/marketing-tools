<!--META {"title":"Affiliate Commission & Margin Viability Calculator","short":"Find the maximum safe commission for your unit economics and test tiered partner payouts.","desc":"Model flat and percentage commission structures against true unit economics after discounts, returns, fees and shipping. See the maximum safe payout, break-even acquisition cost and partner tier viability.","tag":"Finance"} -->
<div class="split">
  <div>
    <div class="card"><h3>Product economics</h3><div id="f1"></div></div>
    <div class="card"><h3>Program rules</h3><div id="f2"></div></div>
    <div class="card"><h3>Partner tiers</h3><p class="sub">Monthly orders and commission rate per tier. Rows with no orders are ignored.</p><div id="tiers"></div><div class="actions"><button class="btn btn-secondary btn-sm" id="addT" type="button">Add tier</button></div></div>
  </div>
  <div id="out" class="out"></div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, C = MT.chart;
MT.fields($('#f1'), [{ id: 'price', label: 'Retail price ($)', value: 89 }, { id: 'tax', label: 'Sales tax included in the price (%)', value: 0, hint: 'Use 0 if your price is before tax. Tax is taken out of revenue.' }, { id: 'cogs', label: 'COGS per unit ($)', value: 27 }, { id: 'fee', label: 'Payment fee (%)', value: 2.9 }, { id: 'feeFix', label: 'Payment fee fixed ($)', value: 0.3 }, { id: 'ship', label: 'Shipping and packaging per order ($)', value: 7.5 }, { id: 'ret', label: 'Return rate (%)', value: 12 }, { id: 'restock', label: 'Returned units resold (%)', value: 80 }, { id: 'disc', label: 'Customer discount via affiliate (%)', value: 10 }], 'g2');
MT.fields($('#f2'), [{ id: 'target', label: 'Target contribution margin (% of kept revenue)', value: 20, hint: 'Margin after product, fee, shipping and commission. Overhead and marketing are not subtracted.' }, { id: 'flat', label: 'Flat payout per order to test ($)', value: 6 }, { id: 'nf', label: 'Network fee (% of commission)', value: 0, hint: 'Extra charged by the affiliate network on top of the commission. 0 if none.' }, { id: 'inc', label: 'Orders that are new because of the partner (%)', value: 100, hint: '100 assumes every partner order would not have happened otherwise. Coupon and cashback sites are often far lower.' }, { id: 'claw', label: 'Commission is reversed on returns', type: 'check', value: true }], 'g2');
let tiers = [{ n: 'Starter', o: 20, c: 8 }, { n: 'Growth', o: 100, c: 10 }, { n: 'Pro', o: 400, c: 12 }, { n: 'Elite', o: 1500, c: 15 }];
function drawTiers() { $('#tiers').innerHTML = `<div class="table-wrap"><table class="t"><thead><tr><th>Tier</th><th>Orders/mo</th><th>Commission %</th><th></th></tr></thead><tbody>${tiers.map((t, i) => `<tr><td><input type="text" id="f_t${i}n" aria-label="Tier ${i + 1} name" data-i="${i}" data-k="n" value="${MT.esc(t.n)}"></td><td><input type="number" id="f_t${i}o" aria-label="Tier ${i + 1} orders per month" data-i="${i}" data-k="o" value="${t.o}"></td><td><input type="number" step="0.5" id="f_t${i}c" aria-label="Tier ${i + 1} commission percent" data-i="${i}" data-k="c" value="${t.c}"></td><td>${tiers.length > 1 ? `<button class="btn btn-ghost btn-sm" data-d="${i}" type="button">Remove</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`; }
$('#tiers').addEventListener('input', e => { const t = e.target; if (t.dataset.i != null) { tiers[+t.dataset.i][t.dataset.k] = t.dataset.k === 'n' ? t.value : (t.value.trim() === '' ? NaN : +t.value); } });
$('#tiers').addEventListener('click', e => { if (e.target.dataset.d != null) { tiers.splice(+e.target.dataset.d, 1); drawTiers(); run(); } });
$('#addT').addEventListener('click', () => { tiers.push({ n: 'Tier ' + (tiers.length + 1), o: 50, c: 10 }); drawTiers(); run(); });
const CHECKS = [['price', 'Retail price', 0.01, 1e9], ['tax', 'Sales tax', 0, 60], ['cogs', 'COGS', 0, 1e9], ['fee', 'Payment fee', 0, 100], ['feeFix', 'Payment fee fixed', 0, 1e6], ['ship', 'Shipping and packaging', 0, 1e9], ['ret', 'Return rate', 0, 100], ['restock', 'Returned units resold', 0, 100], ['disc', 'Customer discount', 0, 99.99], ['target', 'Target contribution margin', 0, 99.99], ['flat', 'Flat payout', 0, 1e9], ['nf', 'Network fee', 0, 500], ['inc', 'New orders share', 0, 100]];
function problems() { const bad = []; CHECKS.forEach(([id, label, lo, hi]) => { const v = MT.f(id); if (!isFinite(v)) bad.push(`${label} is blank or not a number.`); else if (v < lo || v > hi) bad.push(`${label} must be between ${lo} and ${hi > 1e5 ? 'a positive amount' : hi}.`); }); return bad; }
function econ() {
  const price = MT.f('price'), tax = MT.f('tax') / 100, disc = MT.f('disc') / 100, r = MT.f('ret') / 100, rs = MT.f('restock') / 100, claw = MT.$('#f_claw').checked, cogs = MT.f('cogs') * (1 - r * rs), ship = MT.f('ship'), fee = MT.f('fee') / 100, fix = MT.f('feeFix');
  const net = price / (1 + tax) * (1 - disc), kept = net * (1 - r), before = kept - cogs - (price * (1 - disc) * fee + fix) - ship, cbase = net * (claw ? 1 - r : 1);
  const net0 = price / (1 + tax), before0 = net0 * (1 - r) - cogs - (price * fee + fix) - ship;
  return { net, kept, before, before0, cbase, claw, r, k: 1 + MT.f('nf') / 100, target: MT.f('target') / 100, inc: MT.f('inc') / 100 };
}
function run() {
  const bad = problems();
  if (bad.length) { $('#out').innerHTML = MT.notComputed('Not computed: check your inputs', bad); return; }
  const e = econ(), notes = [];
  if (!(e.net > 0 && e.kept > 0)) { $('#out').innerHTML = MT.notComputed('Not computed', ['Order value after discount, tax and returns is zero, so there is nothing to measure.']); return; }
  [['ret', 'Return rate'], ['disc', 'Customer discount'], ['target', 'Target margin'], ['restock', 'Resold share'], ['inc', 'New orders share']].forEach(([id, l]) => { const v = MT.f(id); if (v > 0 && v < 1) notes.push(`${l} is ${v}%. If you meant ${v * 100}%, type ${v * 100}, not ${v}.`); });
  if (e.r >= 0.5) notes.push(`A return rate of ${F.pct(e.r, 0)} is very high. Check it is a percentage of orders.`);
  const pk = e.cbase * e.k, fe = e.claw ? 1 - e.r : 1, maxFlat = e.before - e.target * e.kept, maxC = pk > 0 ? maxFlat / pk : NaN, beC = pk > 0 ? e.before / pk : NaN, flat = MT.f('flat'), flatEff = flat * fe;
  if (!isFinite(maxC)) { $('#out').innerHTML = MT.notComputed('Not computed', ['Every order is returned and the commission is reversed, so there is no revenue to pay commission on. Lower the return rate or untick the reversal.']); return; }
  const marginAt = c => (e.before - c / 100 * pk) / e.kept, paAt = c => e.before - c / 100 * pk;
  const tvalid = tiers.filter(t => isFinite(t.o) && t.o > 0 && isFinite(t.c) && t.c >= 0), tskip = tiers.length - tvalid.length;
  if (tskip) notes.push(`${tskip} tier row${tskip === 1 ? '' : 's'} left out because the orders or the commission are blank, zero or invalid.`);
  const caveat = e.inc >= 1 ? ' This assumes every partner order is new business; lower "Orders that are new" to test coupon or cashback partners.' : '';
  const tm = tvalid.map(t => { const m = marginAt(t.c), pa = paAt(t.c), gain = pa - (1 - e.inc) * e.before0; return { t, m, pa, gain, be: e.before0 > 0 ? 1 - pa / e.before0 : (pa >= 0 ? 0 : 2) }; }), losing = tm.filter(x => x.m >= e.target && x.gain < 0), fragile = tm.filter(x => x.be > 0.5);
  const tierFlag = losing.length ? ` At ${F.pct(e.inc, 0)} new orders, ${losing.length} of ${tm.length} tier${tm.length === 1 ? '' : 's'} lose${losing.length === 1 && tm.length > 0 ? 's' : ''} money even though the per-order margin looks fine.` : fragile.length ? ' Some tiers only pay off if more than half of the partner orders are new (see below).' : '';
  let h = MT.rag(maxC < 0 ? 'red' : (maxC < 0.05 || losing.length || fragile.length) ? 'yellow' : 'green', maxC < 0 ? 'Target margin is unreachable before any commission' : `Maximum safe commission: ${F.pct(maxC, 1)} of the discounted order value`, [`Contribution before commission is ${F.money(e.before, 2)} per order (${F.pct(e.before / e.kept, 1)} of kept revenue). To keep a ${F.pct(e.target, 0)} contribution margin you can pay at most ${F.money(maxFlat, 2)} per order.${caveat}${tierFlag}`]);
  if (notes.length) h += '<div class="note warn" role="note"><b>Check these</b><ul>' + notes.map(t => '<li>' + MT.esc(t) + '</li>').join('') + '</ul></div>';
  h += MT.stats([['Net order value after discount', F.money(e.net, 2), 'expected kept: ' + F.money(e.kept, 2)], ['Contribution before commission', F.money(e.before, 2), F.pct(e.before / e.kept, 1) + ' of kept revenue'], ['Max safe commission', F.pct(maxC, 1), 'for a ' + F.pct(e.target, 0) + ' contribution margin', MT.tone(maxC, 0.1, 0.05)], ['Break-even commission', F.pct(beC, 1), 'contribution reaches zero'], ['Max flat payout per paid order', F.money(maxFlat / fe, 2), 'most you can pay per order if every order is new'], [`Flat ${F.money(flat, 2)} payout margin`, F.pct((e.before - flatEff) / e.kept, 1), (flat <= maxFlat / fe ? 'within target' : 'below target') + (e.claw ? ' (reversed on returns)' : ' (paid on all orders)'), flat <= maxFlat / fe ? 'good' : 'bad']]);
  const cs = MT.range(13).map(i => i * 2.5), rowsS = cs.map(c => { const m = marginAt(c); return [c.toFixed(1) + '%', F.money(e.before - c / 100 * pk, 2), { h: `<span style="display:block;padding:.15rem .3rem;${MT.cellTone(m >= e.target ? 'good' : m >= 0 ? 'warn' : 'bad')}">${F.pct(m, 1)}</span>` }]; });
  h += '<div class="card"><div id="ch"></div></div>';
  if (tvalid.length) {
    const lowInc = fragile.map(x => x.t.n || '(unnamed)');
    const trows = tm.map(({ t, m, pa, gain, be }) => {
      const rec = Math.min(t.c, maxC * 100), okM = m >= e.target, ok = okM && gain >= 0;
      const tag = ok ? MT.tag(e.inc >= 1 ? 'Viable if every order is new' : 'Viable', 'good') : okM ? MT.tag(`Loses money at ${F.pct(e.inc, 0)} new orders`, 'bad') : m >= 0 ? MT.tag('Below target', 'warn') : MT.tag('Loses money', 'bad');
      return [t.n || '(unnamed)', F.int(t.o), t.c.toFixed(1) + '%', F.money(t.o * t.c / 100 * pk, 0), F.money(t.o * pa, 0), F.pct(m, 1), be > 1 ? 'Never' : F.pct(Math.max(0, be), 0), F.money(t.o * gain, 0), { h: tag }, okM ? '—' : rec.toFixed(1) + '%'];
    });
    h += '<div class="card"><h3>Partner tier viability</h3>' + MT.tbl(['Tier', 'Orders/mo', 'Commission', 'Monthly payout', 'Monthly contribution $', 'Contribution margin %', 'New orders needed to break even', `Monthly gain at ${F.pct(e.inc, 0)} new orders`, 'Status', 'Cap at'], trows, { num: [1, 2, 3, 4, 5, 6, 7, 9] }) + `<p class="sub">Monthly gain compares the program with no program. Orders that would have happened anyway still cost the discount and the commission. Contribution margin is before overhead and marketing.</p></div>`;
    if (lowInc.length) h += MT.note(`<b>Cannibalisation check.</b> ${lowInc.map(MT.esc).join(', ')} only pay${lowInc.length === 1 ? 's' : ''} off if more than half of the partner orders are new. Coupon, cashback and loyalty partners often capture orders that were already going to happen. Test with a holdout before paying these rates.`, 'warn');
  }
  h += '<div class="card"><h3>Commission sensitivity</h3>' + MT.tbl(['Commission', 'Contribution per order', 'Contribution margin %'], rowsS, { num: [0, 1, 2] }) + '</div>';
  $('#out').innerHTML = h;
  C.line($('#ch'), { title: 'Contribution margin % vs commission rate (dashed: your target)', xs: cs, xFmt: v => v.toFixed(0) + '%', yFmt: v => (v * 100).toFixed(0) + '%', series: [{ name: 'Contribution margin', values: cs.map(marginAt), color: 'var(--series-1)' }, { name: 'Target', values: cs.map(() => e.target), color: 'var(--series-2)', dash: '5 4' }], zero: true });
}
drawTiers(); MT.live(document.querySelector('.split'), run);
})();
</script>
