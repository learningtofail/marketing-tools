<!--META {"title":"CAC, Margin & Payback Modeler","short":"Blended vs fully-loaded CAC, contribution margin and cash payback with a churn and margin sensitivity matrix.","desc":"Settle the definition gap between Marketing and Finance. Compute blended and fully-loaded CAC, contribution margin, LTV and cash payback, then see how payback moves with churn and margin.","tag":"Finance"} -->
<div class="split">
  <div>
    <div class="card"><h3>Acquisition costs (same period)</h3><div id="fCost"></div></div>
    <div class="card"><h3>Unit economics</h3><div id="fUnit"></div></div>
  </div>
  <div>
    <div id="out" class="out"></div>
  </div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, C = MT.chart;
MT.fields($('#fCost'), [
  { id: 'cust', label: 'New customers acquired', value: 400, min: 1 }, { id: 'paid', label: 'Paid media spend ($)', value: 60000 },
  { id: 'agency', label: 'Agency and creative fees ($)', value: 12000 }, { id: 'mkt', label: 'Marketing headcount, fully loaded ($)', value: 30000 },
  { id: 'sales', label: 'Sales headcount, fully loaded ($)', value: 25000 }, { id: 'tools', label: 'Tools, software and other overhead ($)', value: 6000 }
], 'g2');
MT.fields($('#fUnit'), [
  { id: 'arpu', label: 'Revenue per customer per month ($)', value: 120 }, { id: 'cogs', label: 'COGS and delivery cost (% of revenue)', value: 22 },
  { id: 'var', label: 'Other variable cost per customer per month ($)', value: 4 }, { id: 'churn', label: 'Monthly churn (%)', value: 4, hint: 'Used unless you enter a curve below.' },
  { id: 'basis', label: 'CAC basis for payback', type: 'select', value: 'full', options: [['full', 'Fully loaded'], ['paid', 'Paid media only']] }, { id: 'disc', label: 'Annual discount rate (%)', value: 0 },
  { id: 'hor', label: 'Horizon (months)', value: 36, min: 6, max: 120 },
  { id: 'curve', label: 'Custom retention curve (optional)', type: 'text', value: '', placeholder: 'Month-by-month % still active, e.g. 100,92,86,81', hint: 'Month 1 first. Overrides churn.' }
], 'g2');
function retention(h) { const cur = String(MT.$('#f_curve').value).split(/[,\s]+/).map(Number).filter(x => isFinite(x)); const ch = MT.f('churn') / 100; const r = []; for (let t = 1; t <= h; t++) { if (cur.length) { const v = t <= cur.length ? cur[t - 1] / 100 : (cur.length > 1 ? cur[cur.length - 1] / 100 * Math.pow(cur[cur.length - 1] / cur[Math.max(0, cur.length - 2)] || 1, t - cur.length) : 0); r.push(Math.max(0, v)); } else r.push(Math.pow(1 - ch, t - 1)); } return r; }
function payback(cac, m, ret, d) { let cum = 0; const curve = []; let pb = null; for (let t = 0; t < ret.length; t++) { const df = Math.pow(1 + d, -(t + 1) / 12); const add = ret[t] * m * df; const prev = cum; cum += add; curve.push(cum); if (pb == null && cum >= cac) pb = t + (cac - prev) / add; } return { pb, curve, ltv: cum }; }
function run() {
  const N = MT.f('cust'), paid = MT.f('paid'), total = paid + MT.f('agency') + MT.f('mkt') + MT.f('sales') + MT.f('tools'), blended = paid / N, full = total / N;
  const H = Math.round(MT.f('hor')) || 36, d = MT.f('disc') / 100, arpu = MT.f('arpu'), gm = 1 - MT.f('cogs') / 100, m = arpu * gm - MT.f('var'), cac = MT.$('#f_basis').value === 'paid' ? blended : full;
  if (!(N > 0) || !isFinite(m)) { $('#out').innerHTML = MT.note('Enter customers acquired and unit economics.'); return; }
  const ret = retention(H), pb = payback(cac, m, ret, d), ltv = pb.ltv, ltvCac = ltv / cac, gmPct = m / arpu, ch = MT.f('churn') / 100;
  const simple = ch > 0 ? m / ch : NaN;
  let h = MT.verdict(pb.pb == null ? 'neg' : pb.pb <= 12 ? 'pos' : pb.pb <= 18 ? 'neu' : 'neg', pb.pb == null ? `Not paid back within ${H} months` : `Cash payback in ${pb.pb.toFixed(1)} months`, `${MT.$('#f_basis').value === 'paid' ? 'Paid-only' : 'Fully loaded'} CAC of ${F.money(cac, 0)} against ${F.money(m, 2)} monthly contribution per active customer. LTV:CAC over ${H} months is ${ltvCac.toFixed(2)}.`);
  h += MT.stats([['Blended CAC (paid only)', F.money(blended, 0), F.money(paid, 0) + ' / ' + F.int(N)], ['Fully loaded CAC', F.money(full, 0), 'incl. fees, headcount, tools'], ['Loading gap', F.spct(full / blended - 1, 0), 'fully loaded vs paid-only'], ['Contribution per customer-month', F.money(m, 2), F.pct(gmPct, 1) + ' margin'], [`LTV (${H} mo, contribution)`, F.money(ltv, 0), isFinite(simple) ? 'Formula m/churn: ' + F.money(simple, 0) : ''], ['LTV:CAC', ltvCac.toFixed(2) + 'x', ltvCac >= 3 ? 'above the 3x rule of thumb' : 'below 3x', ltvCac >= 3 ? 'good' : ltvCac >= 1.5 ? 'warn' : 'bad']]);
  h += '<div class="card"><div id="cc"></div></div>';
  // sensitivity
  const base = MT.f('churn'), churns = [0.5, 0.75, 1, 1.5, 2].map(x => +(base * x).toFixed(2)), gms = [-10, -5, 0, 5, 10].map(x => Math.max(1, Math.min(99, gm * 100 + x)));
  const head = ['Monthly churn \\ Gross margin'].concat(gms.map(g => g.toFixed(0) + '%')), rows = churns.map(c => [c.toFixed(1) + '%'].concat(gms.map(g => { const mm = arpu * g / 100 - MT.f('var'), r = []; for (let t = 1; t <= 120; t++) r.push(Math.pow(1 - c / 100, t - 1)); const p = payback(cac, mm, r, d).pb, tone = p == null ? 'bad' : p <= 12 ? 'good' : p <= 18 ? 'warn' : 'bad'; return { h: `<span style="display:block;padding:.15rem .3rem;${MT.cellTone(tone)}">${p == null ? '>120' : p.toFixed(1)}</span>`, cls: 'c' }; })));
  h += '<div class="card"><h3>Payback months: churn vs gross margin</h3><p class="sub">Green is 12 months or less, amber 12 to 18, red beyond 18. Base case is the middle row and column.</p>' + MT.tbl(head, rows, { cls: 'heat' }) + '</div>';
  const exec = `CAC and payback summary\nCustomers acquired: ${F.int(N)}\nBlended (paid) CAC: ${F.money(blended, 0)}\nFully loaded CAC: ${F.money(full, 0)}\nContribution per customer-month: ${F.money(m, 2)} (${F.pct(gmPct, 1)})\nPayback (${MT.$('#f_basis').value === 'paid' ? 'paid-only' : 'fully loaded'} CAC): ${pb.pb == null ? 'not within ' + H + ' months' : pb.pb.toFixed(1) + ' months'}\nLTV over ${H} months: ${F.money(ltv, 0)}; LTV:CAC ${ltvCac.toFixed(2)}x`;
  h += `<div class="card"><h3>Summary for finance review</h3><pre class="code" id="ex">${MT.esc(exec)}</pre><div class="actions"><button class="btn btn-secondary btn-sm" id="cp" type="button">Copy summary</button></div></div>`;
  $('#out').innerHTML = h;
  C.line($('#cc'), { title: 'Cumulative contribution per acquired customer vs CAC', xs: MT.range(H, 1), xFmt: v => 'Month ' + Math.round(v), yFmt: v => F.money(v, 0), series: [{ name: 'Cumulative contribution', values: pb.curve, color: 'var(--series-1)' }, { name: 'CAC', values: pb.curve.map(() => cac), color: 'var(--series-2)', dash: '5 4' }] });
  $('#cp').addEventListener('click', e => MT.copy(exec, e.target));
}
MT.live(document.querySelector('.split'), run);
})();
</script>
