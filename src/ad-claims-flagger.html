<!--META {"title":"Ad Claims Substantiation & Compliance Flagger","short":"Highlight superlatives, absolutes and unqualified claims in ad copy, with qualifying language and review guidance.","desc":"Paste draft ad copy, landing page text or a script. The tool scans for superlatives, absolute guarantees, savings, health, comparative and environmental claims, checks for qualifying disclaimers, and returns annotated copy with advice.","tag":"Compliance"} -->
<div class="split">
<div>
  <div class="card"><h3>Copy to check</h3><div class="field"><textarea id="f_txt" rows="14" placeholder="Paste ad copy, landing page text or a script."></textarea></div>
    <div class="actions"><button class="btn btn-primary" id="go" type="button">Scan claims</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div></div>
</div>
<div id="out" class="out"></div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt;

const fr = src => new RegExp('(^|[^\\p{L}\\p{N}])(' + src + ')(?![\\p{L}\\p{N}])', 'giu');
const prevWord = (t, s) => (t.slice(Math.max(0, s - 14), s).match(/([A-Za-z#.]+)\s*$/) || [, ''])[1].toLowerCase();

/* [regex, category, severity, advice, needsProof, filter(text, start, end), phraseGroup, mask] */
const R = [
  [/\bthese statements have not been evaluated by the (?:food and drug administration|fda)[^.\n]*\.?|\b(?:this )?product is not intended to (?:diagnose|treat|cure|or prevent|prevent)[^.\n]*\.?/gi, 'Qualifier', 'info', 'Required supplement disclaimer found. Keep it, with the claims it covers, in readable size.', false, null, 0, true],
  [/#\s?1\b|\bnumber[\s-]one\b|\bno\.?\s?1\b/gi, 'Superlative', 'high', 'Ranking claims need a named, recent, independent source. Add "according to [source, year]" or remove.', true, noPartNo],
  [/\b(best|greatest|finest|top[\s-]rated|most (?:trusted|popular|reliable|powerful|advanced|accurate|loved|recommended)|world[\s-]class|unbeatable|unmatched|unrivaled|second to none|leading|industry[\s-]leading|market[\s-]leading|award[\s-]winning|world['’]s (?:favou?rite|best|largest|leading|first))\b/gi, 'Superlative', 'high', 'Objective superlatives require substantiation. Keep only if you hold documented proof, or soften to a specific, verifiable fact. Plain opinion puffery ("great coffee") is lower risk than a measurable claim.', true, (t, s, e) => { const w = t.slice(s, e).toLowerCase(), n = nextWord(t, e); if (w === 'leading') return !/^(to|up|the|cause|edge|edge)$/.test(n); if (w === 'best') return !/^(practice|practices|regards|wishes|of|buy|before)$/.test(n); return true; }],
  [/\b(fastest|quickest|cheapest|lowest[\s-]prices?|lowest[\s-]costs?|biggest|largest|smallest|strongest|safest|easiest|most affordable)\b|\b(?:more|better|faster|cheaper|bigger) [\w\s]{0,30}?than (?:any|every|all) (?:other|competitor|rival)s?\b|\bhalf[\s-]?(?:the )?price\b/gi, 'Superlative', 'high', 'Comparative extremes need head-to-head data. State the measure, the comparison set and the date.', true],
  [/\bguarantee[ds]?\b|\b100\s?%\s?(?:satisfaction|guaranteed|safe|natural|effective|secure)|\bmoney[\s-]back\b|\brefund every penny\b|\bsatisfaction (?:assured|guaranteed)\b/gi, 'Guarantee', 'high', 'State the full terms next to the claim: duration, conditions, how to claim. Regulators expect the terms to be disclosed clearly.', false],
  [/\bguaranteed (?:approval|acceptance|loan|credit|income|returns?|results?|cure|weight loss)\b|\bpre[\s-]?approved\b|\bno credit check\b|\bget approved\b|\bdouble your (?:money|investment)\b|\bmoney (?:will )?double\b/gi, 'Finance claim', 'high', 'Lending and investing claims like this are the problem in themselves, not just their terms. Regulators restrict "guaranteed approval", "pre-approved" and guaranteed returns. Remove or have compliance rewrite it.', true],
  [new RegExp('\\b(?:\\d+(?:\\.\\d+)?\\s?%\\s?(?:apr|apy|interest|return|returns|cash ?back)|0\\s?%\\s?(?:apr|interest|financing)|earn \\d+(?:\\.\\d+)?\\s?%|rates? as low as \\d+(?:\\.\\d+)?\\s?%)', 'gi'), 'Finance claim', 'high', 'Rates and returns need the full cost of borrowing or the basis and period shown next to them (APR, fees, conditions, how long the rate lasts).', true],
  [/\brisk[\s-]free\b|\bno[\s-]risk\b|\bzero[\s-]risk\b|\bfoolproof\b|\bworks every time\b|\bnever fails?\b|\bpermanent(?:ly)?\b|\bforever\b|\bworks for everyone\b|\bno side effects\b/gi, 'Absolute', 'high', 'Absolute claims are hard to defend. Replace with a bounded, measurable statement or add explicit conditions.', true, (t, s, e) => !/^(resident|residents|address|marker|magnet|position|employee|employees|staff|link|redirect|record|home|job|jobs|contract|account)$/.test(nextWord(t, e))],
  [/\b(clinically|scientifically|medically) (?:proven|tested|shown)\b|\bclinical (?:studies|trials?) (?:show|prove|confirm)\b|\bbacked by science\b|\bdoctor[\s-](?:recommended|formulated|approved|developed)\b|\bdermatologist[\s-]tested\b|\bFDA[\s-](?:approved|cleared)\b|\bhealth canada[\s-](?:approved|authori[sz]ed|licen[cs]ed)\b|\bapproved by (?:health canada|the fda)\b|\bcures?\b|\b(?:treats?|prevents?|reverses?|relieves?|heals?|eliminates?) (?:\w+ ){0,2}(?:pain|arthritis|diabetes|cancer|disease|condition|illness|anxiety|depression|infection|symptoms|inflammation|acne|insomnia|cartilage damage|damage)\b|\bdetox(?:ify)?\b|\bhealthy inflammation(?: response)?\b|\bboosts? (?:your )?(?:immune system|immunity|metabolism|energy)\b|\bsupports? (?:healthy )?(?:joint|immune|heart|brain|prostate|gut|bone) (?:health|function)?\b|\b(?:melts?|burns?) (?:belly )?fat\b|\bbelly fat\b|\blose (?:weight|fat)(?: fast)?\b|\byears younger\b/gi, 'Health or science', 'high', 'Needs competent and reliable scientific evidence on file, and review by legal or regulatory. Cite the study in a footnote. Health, supplement and drug claims are regulated by country (FDA/FTC, Health Canada, Quebec rules).', true],
  [/\blos(?:e|t)\s+\d+\s?(?:lbs?|pounds|kg|kilos)|\bearn\s+\$\s?\d(?:[\d,]*\d)?|\bmake\s+\$\s?\d(?:[\d,]*\d)?|\bI lost \d+/gi, 'Results claim', 'high', 'Specific outcomes must reflect typical results. Add a clear typical-results disclosure or remove. Testimonials count as claims.', true],
  [/\b(save|saves|saving) (?:up to |over )?(?:\$\s?\d(?:[\d,]*\d)?|\d+\s?%)|\b\d+\s?%\s?off\b|\bup to \d+\s?%|\bup to \$\s?\d(?:[\d,]*\d)?(?: off)?|\$\s?\d(?:[\d,]*\d)? off\b|\b(?:was|regular(?:ly)?) \$\s?\d|\bfree (?:shipping|delivery|returns?|trial|gift|bonus|upgrade|install(?:ation)?|consultation|sample|samples|access|onboarding|setup|membership|month|year)\b|\bfor free\b|\blimited[\s-]time\b|\bonly today\b|\blast chance\b|\bwhile supplies last\b|\bonly \d+ (?:left|remaining|rooms?|seats?|spots?)\b|\bsale ends?\b|\bends (?:tonight|today|soon|sunday)\b|\bweekend only\b|\bhurry\b/gi, 'Price or offer', 'med', 'Show the terms: end date, exclusions, minimum spend, who qualifies. "Free" must not have hidden conditions. Reference prices must be genuine prior prices. Scarcity claims ("only 3 left") must be true.', false],
  [/\bfrom (?:just |only )?(?:\$|£|€)\s?\d(?:[\d,]*\d)?|\$\s?\d(?:[\d,]*\d)?\s?(?:a|per|\/)\s?(?:month|mo|week|wk)\b|\bfrom (?:£|€)\s?\d(?:[\d,]*\d)?/gi, 'Price or offer', 'high', 'A "from" or per-month price must come with what is included and the all-in price. In Canada and the UK the advertised price has to include mandatory fees.', false],
  [/\bplus (?:taxes|tax|freight|pdi|destination|licen[cs]ing|admin(?:istration)? fees?|booking fees?|fees|extra fees?)\b|\b(?:fees?|taxes|supplements|charges) extra\b|\bnot included\b|\bextra fees? (?:apply|may apply)\b/gi, 'Drip pricing', 'high', 'Mandatory fees and charges must be in the headline price. Showing them later ("plus freight, PDI") is drip pricing and conflicts with an "all-in" claim.', false],
  [/\b(?:better|faster|cheaper|stronger|more effective|more reliable) than\b|\bunlike (?:other|the competition|competitors)\b|\bbeats? (?:the )?competition\b|\bout[\s-]?performs?\b/gi, 'Comparative', 'high', 'Name the comparison, the metric and the test date. Keep the test data on file. Avoid disparaging competitors without proof.', true],
  [/\b(?:eco[\s-]friendly|sustainable|carbon[\s-](?:neutral|negative)|net[\s-]zero|biodegradable|compostable|recyclable|non[\s-]toxic|all[\s-]natural|100\s?%\s?natural|natural (?:ingredients|formula|remedy)|chemical[\s-]free|green (?:product|energy|packaging|choice|solution|certified|cleaning)|going green|organic)\b/gi, 'Environmental or natural', 'med', 'Green Guides and EU/UK rules require specific, qualified claims. Say what is recyclable, where, and what share of the product. Offset-based "carbon neutral" claims face tighter rules in the EU. "Organic" needs certification.', true],
  [/\bmade in (?:the )?(?:usa|u\.s\.a?\.|america|canada)\b|\bproudly (?:american|canadian)\b/gi, 'Origin', 'med', '"Made in" claims need all or virtually all of the product made domestically. Qualify with "assembled in" or "with imported parts" where needed.', true],
  [new RegExp('\\b(?:as seen (?:on|in)|featured (?:on|in)|trusted by|used by (?:millions|thousands|\\d[\\d,]+)|' + N + '\\+? (?:customers|users|clients|members|families))\\b', 'gi'), 'Social proof', 'med', 'Verify the number and the date. Keep a source and update it regularly. Name the media outlet only with permission.', true],
  [/\b(?:results?|savings?) (?:may )?vary\b|\bnot typical\b|\bterms (?:and conditions )?apply\b|\bsee (?:details|terms|site)\b|\bconditions apply\b|\bbased on (?:an? )?(?:\d(?:[\d,]*\d)? |internal|independent|survey|study|studies|data|testing|tests?|results|research|\d{4})|\bsource:/gi, 'Qualifier', 'info', 'Qualifier found. Make sure it sits near the claim, in readable size and contrast.', false],
  /* French rules, partial. */
  [fr('(?:le|la|les) meilleur(?:e|s|es)?|le plus (?:grand|rapide|fiable|populaire|puissant|avancé|performant|recommandé|vendu|abordable)|numéro (?:un|1)|n[°o] ?1|leader(?: du marché| de l[’\']industrie)?|inégalé(?:e|s|es)?|imbattable|sans égal|primé(?:e|s|es)?|les prix les plus bas|le moins cher|le plus bas prix'), 'Superlative', 'high', 'Objective superlatives require substantiation. Cite a named, recent source or soften to a verifiable fact. (Partial French rules.)', true, null, 2],
  [fr('garanti(?:e|s|es)?|satisfait ou remboursé|remboursement garanti|100 ?% (?:garanti|satisfaction|naturel|sûr|efficace)'), 'Guarantee', 'high', 'State the full terms next to the claim: duration, conditions, how to claim. (Partial French rules.)', false, null, 2],
  [fr('sans risque|zéro risque|aucun risque|infaillible|permanent(?:e|s|es)?|pour toujours|à vie|sans effets? secondaires?'), 'Absolute', 'high', 'Absolute claims are hard to defend. Replace with a bounded, measurable statement. (Partial French rules.)', true, (t, s, e) => !/^(resident|residents|residente|residentes)$/.test(nextWord(t, e)), 2],
  [fr('cliniquement prouvé(?:e|s|es)?|scientifiquement prouvé(?:e|s|es)?|testé cliniquement|approuvé par (?:santé canada|la fda)|recommandé par (?:les )?(?:médecins|dentistes|dermatologues)|guérit|guérison|détox(?:ifi\\w*)?|élimine (?:la )?graisse|perdez? \\d+ ?(?:lb|livres|kg|kilos)'), 'Health or science', 'high', 'Needs scientific evidence on file and legal review. (Partial French rules.)', true, null, 2],
  [fr('économisez(?: jusqu[’\']à)? ' + N + ' ?(?:\\$|%|€)|jusqu[’\']à ' + N + ' ?% (?:de rabais|de réduction)|' + N + ' ?% de (?:rabais|réduction)|gratuit(?:e|s|es)?|offre à durée limitée|dernière chance|jusqu[’\']à épuisement|il n[’\']en reste que \\d+|seulement \\d+ (?:restant|disponible)s?'), 'Price or offer', 'med', 'Show the terms: end date, exclusions, who qualifies. In Quebec the advertised price must include mandatory fees. (Partial French rules.)', false, null, 2],
  [fr('meilleur(?:e|s|es)? que|plus (?:rapide|efficace|fiable|performant|économique)s? que|contrairement à la concurrence|surpasse'), 'Comparative', 'high', 'Name the comparison, the metric and the test date, and keep the data on file. (Partial French rules.)', true, null, 2],
  [fr('écologique|éco-responsable|carboneutre|neutre en carbone|biodégradable|compostable|recyclable|non toxique|100 ?% naturel|tout naturel|sans produits chimiques|zéro déchet'), 'Environmental or natural', 'med', 'Environmental claims must be specific and supportable. (Partial French rules.)', true, null, 2],
  [fr('fabriqué (?:au|en) (?:québec|canada|france)|produit du (?:québec|canada)|fièrement (?:québécois|canadien)|conçu au (?:québec|canada)'), 'Origin', 'med', '"Made in" claims need all or virtually all of the product made there. (Partial French rules.)', true, null, 2],
  [fr('(?:plus de )?' + N + ' (?:clients?|utilisateurs?|membres?|familles?)|fait confiance|approuvé par (?:des )?millions'), 'Social proof', 'med', 'Verify the number and date and keep a source. (Partial French rules.)', true, null, 2],
  [fr('les résultats peuvent varier|résultats? non typiques?|conditions? (?:s[’\']appliquent|applicables)|certaines conditions|voir (?:les )?(?:détails|conditions)|selon (?:une |notre )?(?:étude|sondage|enquête)|source ?:'), 'Qualifier', 'info', 'Qualifier found. Make sure it sits near the claim. (Partial French rules.)', false, null, 2]

function scan(t) {
  const hits = [];
  R.forEach(([re, cat, sev, adv, proof, filt, g, mask]) => { re.lastIndex = 0; let m; while ((m = re.exec(t))) { const txt = g ? m[g] : m[0], s = m.index + (g ? m[1].length : 0); if (!m[0].length) { re.lastIndex++; continue; } const e = s + txt.length; if (!filt || filt(t, s, e)) hits.push({ s, e, txt, cat, sev, adv, proof, mask: !!mask }); } });
  hits.sort((a, b) => a.s - b.s || b.e - a.e); const out = []; let end = -1;
  hits.forEach(h => { if (h.s >= end) { out.push(h); end = h.e; } else if (h.sev !== 'info' && out.length && out[out.length - 1].sev === 'info' && !out[out.length - 1].mask && h.e > end) { out.push(h); end = h.e; } });
  return out;
}
function lang(t) { const w = t.toLowerCase().match(/[\p{L}]+/gu) || [], f = w.filter(x => ['le', 'la', 'les', 'des', 'pour', 'dans', 'avec', 'une', 'est', 'et', 'du', 'au', 'aux', 'sur', 'vous', 'nous', 'vos', 'votre', 'notre', 'chez'].includes(x)).length, e = w.filter(x => ['the', 'and', 'to', 'of', 'is', 'you', 'your', 'with', 'for', 'in', 'our', 'are', 'a'].includes(x)).length, nonLatin = (t.match(/[^\u0000-ɏ\s\d\p{P}\p{S}]/gu) || []).length; if (w.length && nonLatin / w.join('').length > 0.3) return 'other'; return f > e ? 'fr' : 'en'; }
function run() {
  let t = $('#f_txt').value; const notes = [];
  if (!t.trim()) { $('#out').innerHTML = MT.notComputed('Paste copy to scan', ['Nothing was scanned.']); return; }
  if (/<\/?[a-z][^>]*>|<!--/i.test(t)) { t = t.replace(/<!--[\s\S]*?-->/g, ' ').replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/[ \t]{2,}/g, ' '); notes.push('HTML tags and comments were removed before scanning, so markup and code comments are not read as copy.'); }
  const lg = lang(t), hits = scan(t), claims = hits.filter(h => h.sev !== 'info'), quals = hits.filter(h => h.sev === 'info');
  const star = (t.match(/[A-Za-z0-9.,)%"'][*†‡]/g) || []).length, foot = /(^|\n)\s*[*†‡¹²³]\s?\S/.test(t);
  const near = h => quals.some(q => Math.abs(q.s - h.s) <= 300) || (foot && /^[*†‡]/.test(t.slice(h.e, h.e + 2)));
  claims.forEach(h => h.q = near(h));
  const high = claims.filter(h => h.sev === 'high').length, med = claims.filter(h => h.sev === 'med').length, unq = claims.filter(h => h.proof).length, noq = claims.filter(h => !h.q).length;
  const words = t.trim().split(/\s+/).length, density = claims.length / Math.max(words / 100, 1), pl = (n, a, b) => n + ' ' + (n === 1 ? a : b);
  const cov = 'This scanner matches about 25 phrase patterns in English and a partial set in French. It does not know your country, your industry\'s rules, or whether a claim is true. Wording it does not recognise gets no flag.';
  let h;
  if (lg === 'other') h = MT.notComputed('This language is not supported', ['The copy is mostly in a script or language this scanner has no rules for, so nothing meaningful was checked.']);
  else if (!claims.length) h = MT.verdict('info', 'No listed claim patterns matched. This is not a clearance.', `${pl(words, 'word', 'words')} were scanned. ${MT.esc(cov)} Have anything in a regulated field (health, finance, legal, alcohol, cannabis, children) reviewed by a person.`);
  else h = MT.rag(high >= 3 ? 'red' : 'yellow', high ? `${pl(high, 'high-risk claim', 'high-risk claims')} to substantiate or send to legal` : `${pl(med, 'claim', 'claims')} to qualify`, [`${pl(claims.length, 'flagged phrase', 'flagged phrases')} in ${pl(words, 'word', 'words')} (${density.toFixed(1)} per 100 words), ${pl(quals.length, 'qualifier', 'qualifiers')} found, ${noq} flagged ${noq === 1 ? 'phrase has' : 'phrases have'} no qualifier within 300 characters.`, 'This is a list of what the scanner recognised, not of everything that needs review.']);
  if (lg === 'fr') h += MT.note('<b>French copy.</b> Only a partial set of French patterns is checked, and Quebec Consumer Protection Act and French-language rules are not. Treat a short or empty result as "not screened", never as clear.', 'warn');
  if (lg === 'en' && claims.length) h += MT.note(MT.esc(cov), '');
  if (star && !foot) notes.push('An asterisk marks a claim but no footnote line starting with that mark follows.');
  if (foot && !star) notes.push('A footnote line is present but no mark in the copy points to it.');
  if (notes.length) h += '<div class="note warn" role="note"><b>Notes</b><ul>' + notes.map(n => '<li>' + MT.esc(n) + '</li>').join('') + '</ul></div>';

  h += '<div class="card"><h3>Annotated copy</h3><style>.cl{padding:.05rem .2rem;border-radius:3px;color:var(--ink);border-bottom:2px solid}.cl-high{background:var(--critical-wash);border-color:var(--critical)}.cl-med{background:var(--warn-wash);border-color:var(--warn)}.cl-info{background:var(--good-wash);border-color:var(--good)}.ann{white-space:pre-wrap;line-height:1.75}</style><div class="ann">' + ann + '</div><p class="sub" style="margin-top:.6rem">Red: high risk. Amber: qualify. Green: qualifier or required disclaimer present. Unmarked text was not recognised, which is not the same as approved.</p></div>';

  const grp = new Map(); claims.forEach(x => { const k = x.txt.toLowerCase() + '|' + x.cat; const o = grp.get(k); if (o) o.n++; else grp.set(k, Object.assign({ n: 1 }, x)); });
  const rowsU = Array.from(grp.values());
  h += '<div class="card"><h3>Claims and advice</h3>' + (rowsU.length ? MT.tbl(['Phrase', 'Type', 'Risk', 'Proof needed', 'Qualifier nearby', 'What to do'], rowsU.map(x => [x.txt + (x.n > 1 ? ' (x' + x.n + ')' : ''), x.cat, { h: tg(x.sev) }, x.proof ? 'Yes' : 'Terms', x.q ? 'Yes' : 'No', x.adv])) : '<p class="muted">Nothing flagged. That does not mean the copy is clear.</p>') + '<div class="actions"><button class="btn btn-secondary btn-sm" id="dl" type="button">Download CSV</button><button class="btn btn-secondary btn-sm" id="cp" type="button">Copy review checklist</button></div></div>';
  h += MT.note('<b>This is a screen, not legal advice.</b> The scanner matches phrases and cannot judge whether a claim is true or how a court or regulator would read it. Requirements differ by country and industry (FTC and state law in the US, Competition Bureau and Quebec rules in Canada, ASA in the UK, and stricter rules for health, finance, and children). Send every high-risk item to legal or compliance, and keep the supporting evidence on file before launch.');
  $('#out').innerHTML = h;
  const ctx = x => t.slice(Math.max(0, x.s - 40), Math.min(t.length, x.e + 40)).replace(/\s+/g, ' ');
  $('#dl').addEventListener('click', () => MT.download('claims-review.csv', MT.toCSV([['phrase', 'type', 'risk', 'qualifier_nearby', 'context', 'advice']].concat(claims.map(x => [x.txt, x.cat, x.sev, x.q ? 'yes' : 'no', ctx(x), x.adv]))), 'text/csv'));
  $('#cp').addEventListener('click', e => MT.copy(claims.map(x => `[ ] "${x.txt}" (${x.cat}, ${x.sev}): ${x.adv}`).join('\n'), e.target));
}
$('#smp').addEventListener('click', () => { $('#f_txt').value = `The #1 project management tool trusted by 50,000 teams. Our industry-leading platform is the fastest way to ship, guaranteed. Try it risk-free for 30 days, and save up to 40% on annual plans. Clinically proven to reduce stress*, and better than the competition at every price point. Our eco-friendly packaging is 100% recyclable. Limited-time offer, free onboarding for new accounts. Terms apply.

*Based on an internal survey of 200 users in 2025.`; run(); });
$('#go').addEventListener('click', run);
})();
</script>
