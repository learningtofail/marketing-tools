<!--META {"title":"Paid Ad Quality Score & Landing Page Checklist Scorer","short":"Score ad relevance, expected CTR and landing page experience with a weighted checklist and text-match checks.","desc":"Enter a keyword, ad copy and landing page text. The tool checks keyword presence, message match and page-experience factors, then estimates each Quality Score component and lists the fixes that matter most.","tag":"Paid search"} -->
<div class="split">
<div>
  <div class="card"><h3>Keyword and ad</h3>
    <div class="field"><label for="f_keyword">Target keyword</label><input id="f_keyword" type="text" placeholder="waterproof trail running shoes"></div>
    <div class="field"><label for="f_headlines">Ad headlines (one per line)</label><textarea id="f_headlines" rows="4"></textarea></div>
    <div class="field"><label for="f_descriptions">Ad descriptions (one per line)</label><textarea id="f_descriptions" rows="3"></textarea></div>
    <div class="field"><label for="f_url">Display path / final URL</label><input id="f_url" type="text"></div>
  </div>
  <div class="card"><h3>Landing page</h3>
    <div class="field"><label for="f_pageTitle">Page title</label><input id="f_pageTitle" type="text"></div>
    <div class="field"><label for="f_h1">H1 heading</label><input id="f_h1" type="text"></div>
    <div class="field"><label for="f_body">Visible page text (first screen and body; leave out menus and footers)</label><textarea id="f_body" rows="6"></textarea></div>
  </div>
  <div class="card"><h3>Manual checks</h3><p class="sub">Answer only what you have verified. "Not checked" is left out of the score, not counted as a failure.</p><div id="chk" class="checks stack"></div>
    <div class="actions"><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div></div>
</div>
<div id="out" class="out"></div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt;
/* [group, label, points, fix]. Groups: ad = ad and keyword, appeal = ad appeal, lp = landing page. */
const CH = [
  ['appeal', 'Ad includes a clear offer, price or differentiator', 3, 'Add a concrete offer or proof point to a headline.'],
  ['appeal', 'Ad has a strong call to action', 2, 'End a description with a specific action verb.'],
  ['appeal', 'Ad uses ad assets (sitelinks, callouts, structured snippets)', 3, 'Add sitelinks, callouts and structured snippets.'],
  ['appeal', 'Keyword is in a match type that fits its intent (not broad on a head term)', 2, 'Tighten match types on high-volume terms.'],
  ['lp', 'Page loads in under 3 seconds on mobile', 4, 'Compress images, defer scripts and fix Core Web Vitals.'],
  ['lp', 'Page is mobile responsive with tap-friendly buttons', 3, 'Fix mobile layout and tap targets.'],
  ['lp', 'Call to action is visible above the fold', 3, 'Move the primary button above the fold.'],
  ['lp', 'Page has clear navigation, privacy policy and contact details', 2, 'Add privacy, contact and about links.'],
  ['lp', 'Page uses HTTPS with no intrusive pop-ups or interstitials', 3, 'Remove interstitials and mixed content.'],
  ['lp', 'Page offers original, useful content about the searched topic', 3, 'Add specific, original product or service detail.'],
  ['ad', 'Ad group holds a tight theme (under 15 closely related keywords)', 3, 'Split the ad group into tighter themes.']
];
const GROUPS = [['ad', 'Ad and keyword match', 0.3], ['appeal', 'Ad appeal (self-checked)', 0.39], ['lp', 'Landing page', 0.31]];
const FR = new Set('le la les un une des du de d l et ou en au aux pour par sur dans avec chez est sont ce ces cet cette qui que sans'.split(' '));
const RISKY = /\b(cures?|cured|miracle cure|reverse[sd]? (?:diabetes|cancer)|stop (?:taking )?(?:your )?(?:insulin|medication|meds)|guaranteed (?:approval|returns?|cure|weight loss)|lose \d+ ?(?:lbs?|pounds|kg)|get rich|no credit check)\b/i;
const REGULATED = /\b(health|medical|medicine|diabet\w*|cancer|weight loss|supplements?|pharmac\w*|dentist\w*|dentiste\w*|clinic\w*|therap\w*|loans?|prêts?|credit|mortgage|invest\w*|insurance|attorney|lawyer|avocat|gambl\w*|casino|crypto\w*|alcohol|cannabis)\b/i;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’‘]/g, "'");
/* Plural, accent, -ing and trailing-e insensitive stem. Only for plain Latin words; other scripts are compared as they are. */
function stem(w) { if (w.length < 4 || !/^[a-z]+$/.test(w)) return w; let x = w; if (/ies$/.test(x)) x = x.slice(0, -3) + 'y'; else if (!/(ss|us|is)$/.test(x) && /s$/.test(x)) x = x.slice(0, -1); if (x.length > 5 && /ing$/.test(x)) { x = x.slice(0, -3); if (/([^aeiou])\1$/.test(x)) x = x.slice(0, -1); } return x.replace(/e$/, ''); }
function words(s) { return (norm(s).match(/[\p{L}\p{N}]+/gu) || []).filter(w => w.length > 1 && !MT.stop.has(w) && !FR.has(w)).map(stem); }
const seq = (w, p) => { if (!p.length) return false; for (let i = 0; i + p.length <= w.length; i++) { let ok = true; for (let j = 0; j < p.length; j++) if (w[i + j] !== p[j]) { ok = false; break; } if (ok) return true; } return false; };
function cover(kwT, text) { if (!kwT.length) return 0; const t = new Set(words(text)); return kwT.filter(w => t.has(w)).length / kwT.length; }
function draw() { $('#chk').innerHTML = CH.map((c, i) => `<div class="field"><label for="chk_${i}">${MT.esc(c[1])}</label><select id="chk_${i}" data-i="${i}"><option value="">Not checked</option><option value="y">Yes</option><option value="n">No</option></select></div>`).join(''); }
function lvl(s) { return s >= 0.7 ? ['Strong', 'good'] : s >= 0.4 ? ['Mixed', 'warn'] : ['Weak', 'bad']; }
function run() {
  const kw = $("#f_keyword").value.trim(); if (!kw) { $('#out').innerHTML = MT.notComputed('Enter a keyword to score', ['Nothing was scored. Type the target keyword above.']); return; }
  const kwT = words(kw);
  if (!kwT.length) { $('#out').innerHTML = MT.notComputed('Keyword has no content words', ['The keyword is only common words, so it cannot be matched against the copy. Use a more specific keyword.']); return; }
  const hls = $("#f_headlines").value.split('\n').map(s => s.trim()).filter(Boolean), dss = $("#f_descriptions").value.split('\n').map(s => s.trim()).filter(Boolean), ad = hls.concat(dss).join(' '), url = $("#f_url").value, title = $("#f_pageTitle").value, h1 = $("#f_h1").value, body = $("#f_body").value, first = body.slice(0, 600);
  const ans = CH.map((c, i) => { const e = document.getElementById('chk_' + i); return e ? e.value : ''; });
  if (!hls.length && !dss.length && !title.trim() && !h1.trim() && !body.trim()) { $('#out').innerHTML = MT.notComputed('Nothing to check yet', ['Add ad headlines or landing page text. Only the keyword has been entered.']); return; }
  const test = [], T = (key, ok, pts, label, fix, have) => test.push({ key, ok: have === false ? null : ok, pts, label, fix });
  const hasH = hls.length > 0, hasD = dss.length > 0, hasPage = !!(title.trim() || h1.trim() || body.trim());
  const bodyW = body.trim() ? body.trim().split(/\s+/).length : 0, bt = words(body), freq = new Map(); bt.forEach(w => freq.set(w, (freq.get(w) || 0) + 1));
  const top = Math.max(0, ...freq.values()), stuffed = bt.length >= 30 && top >= 10 && top / bt.length > 0.12, topWord = Array.from(freq.entries()).sort((a, b) => b[1] - a[1])[0]; const rawOf = new Map(); (norm(body).match(/[\p{L}\p{N}]+/gu) || []).forEach(w => { if (!rawOf.has(stem(w))) rawOf.set(stem(w), w); });
  T('ad', hls.some(h => seq(words(h), kwT)), 4, 'Exact keyword appears in a headline (singular or plural)', 'Put the full keyword phrase in at least one headline.', hasH);
  T('ad', cover(kwT, hls.join(' ')) >= 0.99, 2, 'All keyword words appear across headlines', 'Include every keyword word in the headlines.', hasH);
  T('ad', dss.some(d => cover(kwT, d) >= 0.5), 2, 'Keyword terms appear in a description', 'Mention the keyword in a description line.', hasD);
  T('ad', hls.length >= 8, 1, 'At least 8 headlines (more asset variety; this helps Ad Strength, not Quality Score directly)', 'Supply 8 to 15 varied headlines.', hasH);
  T('lp', cover(kwT, h1) >= 0.99, 4, 'H1 contains all keyword words', 'Rewrite the H1 to include the keyword.', !!h1.trim());
  T('lp', cover(kwT, title) >= 0.99, 3, 'Page title contains all keyword words', 'Add the keyword to the page title.', !!title.trim());
  T('lp', cover(kwT, first) >= 0.66, 3, 'Keyword terms appear in the first screen of text', 'Repeat the searched topic in the opening copy.', !!body.trim());
  T('lp', cover(kwT, body) >= 0.99 && bodyW >= 150, 2, 'Body has 150+ words covering the keyword', 'Add substantive body copy on the searched topic.', !!body.trim());
  T('lp', !stuffed, 4, 'Page text reads naturally (no keyword stuffing)', 'The page repeats "' + (topWord ? rawOf.get(topWord[0]) || topWord[0] : '') + '" far too often. Rewrite it as useful copy for a person.', !!body.trim());
  T('lp', kwT.some(w => words(url).includes(w)), 1, 'URL or display path contains a keyword term', 'Use a relevant display path and URL slug.', !!url.trim());
  T('lp', (function () { const a = new Set(words(ad)), b = new Set(words(h1 + ' ' + title + ' ' + first)); if (!a.size || !b.size) return false; let n = 0; a.forEach(w => b.has(w) && n++); return n / a.size >= 0.35; })(), 4, 'Ad message and page copy overlap (message match)', 'Reuse the ad offer and wording on the landing page.', (hasH || hasD) && hasPage);
  CH.forEach((c, i) => T(c[0], ans[i] === 'y', c[2], c[1], c[3], ans[i] !== ''));
  const gs = GROUPS.map(([k, name, wt]) => { const t = test.filter(x => x.key === k && x.ok !== null), tot = MT.stat.sum(t.map(x => x.pts)); return { k, name, wt, score: tot ? MT.stat.sum(t.filter(x => x.ok).map(x => x.pts)) / tot : null, n: t.length, all: test.filter(x => x.key === k).length }; });
  const live = gs.filter(g => g.score !== null), wsum = MT.stat.sum(live.map(g => g.wt));
  const raw = live.length ? MT.stat.sum(live.map(g => g.score * g.wt)) / wsum : 0, text = [ad, title, h1, body].join(' '), risky = RISKY.exec(text), regulated = REGULATED.test(kw + ' ' + text);
  let score = Math.round(raw * 100), capNote = '';
  if (stuffed) { score = Math.min(score, 50); capNote = 'Capped at 50 because the page text looks stuffed with the keyword.'; }
  if (risky) { score = Math.min(score, 30); capNote = 'Capped at 30 because the copy contains a claim Google Ads policy is likely to disapprove: "' + risky[0] + '".'; }
  const manualUn = ans.filter(a => a === '').length, thin = live.length < 3, unans = test.filter(x => x.ok === null).length;
  const sorted = live.slice().sort((a, b) => a.score - b.score), spread = live.length > 1 ? sorted[sorted.length - 1].score - sorted[0].score : 1;
  const weak = live.length < 2 ? '' : spread < 0.05 ? 'No single weak area: the checked areas score about the same.' : 'Weakest area: ' + sorted[0].name + '.';
  let h = risky ? MT.verdict('neg', 'Policy review needed before anything else', `This copy makes claims that Google Ads and the platforms' health, finance and misleading-claims policies are likely to disapprove (matched: "${MT.esc(risky[0])}"). A checklist score does not matter if the ad is not approved, Readiness score: ${score} out of 100, capped at 30.`)
    : MT.verdict(score >= 75 && manualUn < 6 ? 'pos' : score >= 50 ? 'neu' : 'neg', `Copy readiness ${score} out of 100${manualUn >= 6 ? ', from text checks only' : ''}`, `${weak} ${thin ? 'Based on ' + live.length + ' of 3 areas; the rest were not assessed. ' : ''}${stuffed ? MT.esc(capNote) + ' ' : ''}This is a pre-launch copy checklist with this tool's own weights. It is not Google's Quality Score and does not predict it; Google computes Quality Score from live auction data.`);
  h += MT.stats(gs.map(g => { if (g.score === null) return [g.name, 'Not assessed', 'no answers yet']; const l = lvl(g.score); return [g.name, l[0], Math.round(g.score * 100) + ' of 100', l[1]]; }));
  if (regulated && !risky) h += MT.note('<b>Policy approval is not assessed.</b> Health, finance, legal, gambling and similar ads are reviewed against Google Ads policies before Quality Score matters. This checklist does not read claims. Have the copy reviewed separately.', 'warn');
  if (/[^\u0000-ɏ]/.test(kw)) h += MT.note('<b>Language support.</b> This keyword uses a script the tool cannot stem. Only exact word matches are checked, so singular, plural and other word forms will not match.', 'warn');
  if (unans) h += MT.note(`<b>${unans} check${unans === 1 ? '' : 's'} not assessed</b> because the field was blank or the manual answer is "Not checked". They are left out of the score, not counted as failures.`);
  const fails = test.filter(x => x.ok === false).sort((a, b) => b.pts - a.pts), area = { appeal: 'Ad appeal', ad: 'Ad and keyword', lp: 'Landing page' };
  h += '<div class="card"><h3>Fix these first</h3>' + (fails.length ? MT.tbl(['Fix', 'Area', 'Weight'], fails.slice(0, 10).map(x => [x.fix, area[x.key], x.pts]), { num: [2] }) : '<p class="muted">No assessed check failed.</p>') + '</div>';
  h += '<div class="card"><h3>All checks</h3>' + MT.tbl(['Check', 'Result'], test.map(x => [x.label, { h: x.ok === null ? MT.tag('Not assessed', '') : MT.tag(x.ok ? 'Pass' : 'Fail', x.ok ? 'good' : 'bad') }])) + '</div>';
  h += MT.note('<b>Scoring.</b> Text checks compare keyword words with headlines, descriptions, title, H1, opening copy and URL, ignoring plurals, accents and hyphens. Manual checks use your answers; "Not checked" is left out. The area weights (30 percent ad match, 39 percent ad appeal, 31 percent landing page) and the tiers (70 and 40) are this tool\'s own rules of thumb, not Google\'s. Ad assets and headline count are ad quality inputs, not direct Quality Score components. The page text, ad and keyword are never sent anywhere.');
  $('#out').innerHTML = h;
}
$('#smp').addEventListener('click', () => { $("#f_keyword").value = 'waterproof trail running shoes'; $("#f_headlines").value = 'Waterproof Trail Running Shoes\nFree Returns for 60 Days\nGrip Built for Wet Trails\nShop Trail Shoes Today'; $("#f_descriptions").value = 'Stay dry on every trail. Lightweight waterproof shoes with rugged grip. Order today.'; $("#f_url").value = 'shop.example.com/trail-shoes'; $("#f_pageTitle").value = 'Waterproof Trail Running Shoes | Free 60 Day Returns'; $("#f_h1").value = 'Waterproof Trail Running Shoes'; $("#f_body").value = 'Stay dry on every trail with our lightweight waterproof trail running shoes. Rugged grip, breathable membranes and free returns for 60 days. ' + 'Our shoes are tested on wet rock, mud and roots by trail runners across the country. '.repeat(3); CH.forEach((c, i) => { document.getElementById('chk_' + i).value = [0, 1, 4, 5, 6, 7, 8, 9].includes(i) ? 'y' : ''; }); run(); });
draw(); MT.live(document.querySelector('.split'), run);
})();
</script>
