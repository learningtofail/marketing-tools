<!--META {"title":"Affiliate Revenue Concentration Risk Analyzer","short":"HHI, Pareto and dependency flags that show how exposed your program is to a few partners.","desc":"Upload an affiliate platform report and measure concentration with the Herfindahl-Hirschman Index, Pareto distribution and top-partner dependency, plus what happens if your biggest partners leave.","tag":"Risk"} -->
<div class="card">
  <h3>Affiliate report</h3>
  <p class="sub">CSV with one row per partner or per sale. Needs a partner column and a revenue column. Payout and orders columns are optional. Rows for the same partner are summed.</p>
  <div id="drop"></div>
  <div class="field" style="margin-top:.6rem"><label for="paste">Or paste CSV</label><textarea id="paste" placeholder="partner,revenue,payout&#10;CouponSite,52000,5200"></textarea></div>
  <div class="row3"><div class="field"><label for="cp">Partner column</label><select id="cp"></select></div><div class="field"><label for="cr">Revenue column</label><select id="cr"></select></div><div class="field"><label for="cy">Payout column (optional)</label><select id="cy"></select></div></div>
  <div class="actions"><button class="btn btn-primary" id="go" type="button">Analyze</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div>
  <div class="err" id="err"></div>
</div>
<div id="out"></div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, S = MT.stat, C = MT.chart; let tab = null;
function load(t) { tab = MT.readTable(t); const c = tab.cols; MT.fillSelect($('#cp'), c, /partner|affiliate|publisher|source|name|site/i); MT.fillSelect($('#cr'), c, /revenue|sales|sale amount|order value|gmv/i); MT.fillSelect($('#cy'), c, /payout|commission|earning|cost/i, { none: true }); }
MT.dropzone($('#drop'), t => { $('#paste').value = t; load(t); }); $('#paste').addEventListener('input', MT.debounce(() => load($('#paste').value), 250));
$('#smp').addEventListener('click', () => { const r = MT.rng(5), rows = [['partner', 'revenue', 'payout']]; const big = [['CouponHub', 61000], ['DealFinder', 24000], ['BlogAlpha', 12000], ['ReviewPro', 8000]]; big.forEach(b => rows.push([b[0], b[1], (b[1] * (b[0] === 'CouponHub' ? 0.14 : 0.09)).toFixed(0)])); for (let i = 0; i < 46; i++) { const rev = Math.round(60 + Math.exp(r.n() * 0.9 + 5.2)); rows.push(['Partner_' + String(i + 1).padStart(2, '0'), rev, (rev * 0.09).toFixed(0)]); } const t = MT.toCSV(rows); $('#paste').value = t; load(t); run(); });
function run() {
  $('#err').textContent = ''; if (!tab) { $('#err').textContent = 'Paste or upload a report first.'; return; }
  const pc = $('#cp').value, rc = $('#cr').value, yc = $('#cy').value, m = new Map();
  tab.rows.forEach(r => { const k = String(r[pc]).trim(); if (!k) return; const v = MT.num(r[rc]); if (!isFinite(v)) return; const o = m.get(k) || { rev: 0, pay: 0 }; o.rev += v; if (yc) { const p = MT.num(r[yc]); if (isFinite(p)) o.pay += p; } m.set(k, o); });
  const list = Array.from(m, ([name, o]) => ({ name, rev: o.rev, pay: o.pay })).filter(x => x.rev > 0).sort((a, b) => b.rev - a.rev), n = list.length; if (n < 2) { $('#err').textContent = 'Need at least two partners with positive revenue.'; return; }
  const tot = S.sum(list.map(x => x.rev)), sh = list.map(x => x.rev / tot), hhi = S.sum(sh.map(s => (s * 100) ** 2)), eff = 10000 / hhi, cum = []; sh.reduce((a, s, i) => (cum[i] = a + s, a + s), 0);
  const top = k => S.sum(sh.slice(0, k)), n80 = cum.findIndex(c => c >= 0.8) + 1, n50 = cum.findIndex(c => c >= 0.5) + 1, hhiMin = 10000 / n;
  const asc = sh.slice().reverse(); let lor = [0], acc = 0; asc.forEach(s => { acc += s; lor.push(acc); }); let area = 0; for (let i = 1; i < lor.length; i++) area += (lor[i] + lor[i - 1]) / 2 / n; const gini = 1 - 2 * area;
  const level = hhi > 2500 || sh[0] > 0.3 ? 'red' : hhi > 1500 || sh[0] > 0.2 || top(3) > 0.6 ? 'yellow' : 'green';
  const flags = []; if (sh[0] > 0.3) flags.push(`${list[0].name} alone provides ${F.pct(sh[0], 1)} of revenue.`); else if (sh[0] > 0.2) flags.push(`${list[0].name} provides ${F.pct(sh[0], 1)} of revenue.`); if (top(3) > 0.6) flags.push(`The top 3 partners provide ${F.pct(top(3), 0)}.`); if (hhi > 2500) flags.push('HHI is above 2,500, the conventional threshold for a highly concentrated market.'); else if (hhi > 1500) flags.push('HHI is in the moderately concentrated band (1,500 to 2,500).'); if (!flags.length) flags.push('Revenue is spread across many partners.');
  let h = MT.rag(level, level === 'red' ? 'High concentration risk' : level === 'yellow' ? 'Moderate concentration risk' : 'Low concentration risk', flags);
  h += MT.stats([['HHI', F.int(hhi), 'scale 0 to 10,000', level === 'red' ? 'bad' : level === 'yellow' ? 'warn' : 'good'], ['Effective number of partners', eff.toFixed(1), `of ${n} active (equal split: HHI ${F.int(hhiMin)})`], ['Top partner share', F.pct(sh[0], 1), list[0].name], ['Top 5 share', F.pct(top(5), 1), 'Top 10: ' + F.pct(top(10), 1)], [`Partners for 80% of revenue`, `${n80} (${F.pct(n80 / n, 0)})`, `50% needs ${n50}`], ['Gini coefficient', gini.toFixed(2), '0 = equal, 1 = one partner']]);
  h += '<div class="card"><h3>Loss scenarios</h3>' + MT.tbl(['If you lose', 'Revenue at risk', 'Remaining revenue'], [1, 3, 5].filter(k => k < n).map(k => [k === 1 ? list[0].name : `Top ${k} partners`, F.money(S.sum(list.slice(0, k).map(x => x.rev)), 0) + ' (' + F.pct(top(k), 1) + ')', F.money(tot - S.sum(list.slice(0, k).map(x => x.rev)), 0)]), { num: [1, 2] }) + '</div>';
  h += '<div class="card"><div id="c1"></div><div id="c2"></div></div>';
  const rows = list.slice(0, 25).map((x, i) => { const r = [i + 1, x.name, F.money(x.rev, 0), F.pct(sh[i], 1), F.pct(cum[i], 1)]; if (yc) { const ps = x.pay / x.rev; r.push(F.pct(ps, 1)); } return r; });
  h += '<div class="card"><h3>Top partners</h3>' + MT.tbl(['#', 'Partner', 'Revenue', 'Share', 'Cumulative', ...(yc ? ['Payout / revenue'] : [])], rows, { num: [0, 2, 3, 4, 5] }) + '</div>';
  if (yc) { const avg = S.sum(list.map(x => x.pay)) / tot, hi = list.filter(x => x.rev > 0 && x.pay / x.rev > avg * 1.4).slice(0, 5); if (hi.length) h += MT.note('<b>Payout outliers.</b> These partners cost noticeably more per revenue dollar than the program average of ' + F.pct(avg, 1) + ': ' + hi.map(x => MT.esc(x.name) + ' (' + F.pct(x.pay / x.rev, 1) + ')').join(', ') + '.', 'warn'); }
  h += MT.note('<b>Benchmarks.</b> HHI under 1,500 is unconcentrated, 1,500 to 2,500 moderate, above 2,500 high (US DOJ convention, applied here to revenue share). No single partner above 20% and top 3 under 50% is a common diversification target for affiliate programs.');
  $('#out').innerHTML = h;
  C.hbars($('#c1'), { title: 'Revenue share, top 15 partners', cats: list.slice(0, 15).map(x => x.name), values: sh.slice(0, 15).map(s => s * 100), fmt: v => v.toFixed(1) + '%' });
  C.line($('#c2'), { title: 'Lorenz curve: cumulative revenue share vs cumulative partner share', xs: lor.map((_, i) => i / n * 100), xFmt: v => v.toFixed(0) + '%', yFmt: v => (v * 100).toFixed(0) + '%', series: [{ name: 'Actual', values: lor, color: 'var(--series-1)' }, { name: 'Perfect equality', values: lor.map((_, i) => i / n), color: 'var(--ink-muted)', dash: '4 3' }], table: false });
}
$('#go').addEventListener('click', run);
})();
</script>
