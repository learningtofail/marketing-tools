<!--META {"title":"GTM Container Auditor","short":"Find unused tags, triggers and variables, paused tags, duplicates and deprecated vendors in a Google Tag Manager export.","desc":"Upload a GTM container export JSON. The tool maps tags, triggers and variables, flags orphans, duplicates and legacy tag types, and exports a cleanup list.","tag":"Data governance"} -->
<div class="card"><h3>Container export</h3>
  <p class="sub">In GTM: Admin, Export Container, choose the workspace, then upload the JSON here. Everything is parsed in your browser and nothing is uploaded anywhere.</p>
  <div id="drop"></div>
  <div class="field" style="margin-top:.6rem"><label for="paste">Or paste JSON</label><textarea id="paste" rows="6" placeholder='{"exportFormatVersion":2,"containerVersion":{...}}'></textarea></div>
  <div class="actions"><button class="btn btn-primary" id="go" type="button">Audit container</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div><div class="err" id="err"></div>
</div>
<div id="out"></div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, C = MT.chart;
MT.dropzone($('#drop'), t => { $('#paste').value = t; });
const LEGACY = { ua: 'Universal Analytics (sunset July 2023)', gaawe: null, flc: 'Floodlight counter', fls: 'Floodlight sales', awct: null, sp: 'Google Ads remarketing legacy', gclidw: null, hjtc: null, adm: null, bzi: 'Bizible', fbq: null, pntr: null, ta: null, ts: null, ib: null, ndr: null, tdc: null, cegg: null, crto: null, sdl: null, zone: null, abtGeneric: null, gtes: null };
const DEP = [[/^ua$/, 'Universal Analytics tag (stopped processing data)'], [/^(flc|fls)$/, 'Legacy Floodlight tag; migrate to Google tag Floodlight events'], [/^sp$/, 'Legacy remarketing tag'], [/^(gclidw|awcc|awct)$/, null]];
function refs(o, set) { const s = JSON.stringify(o); (s.match(/\{\{([^{}]+?)\}\}/g) || []).forEach(m => set.add(m.slice(2, -2))); }
function param(t, key) { const p = (t.parameter || []).find(x => x.key === key); return p ? (p.value != null ? p.value : p.list ? JSON.stringify(p.list) : p.map ? JSON.stringify(p.map) : '') : ''; }
const IGNORE = new Set(['name', 'tagId', 'triggerId', 'variableId', 'fingerprint', 'accountId', 'containerId', 'parentFolderId', 'tagManagerUrl', 'notes']);
const sig = o => JSON.stringify(o, (k, v) => IGNORE.has(k) ? undefined : v);
const norm = x => String(x == null ? '' : x).replace(/_/g, '').toLowerCase();
/* Built-in triggers (All Pages 2147479553, Consent Initialization 2147479572, Initialization 2147479573 and siblings) are never listed in the export's trigger array. Matching on the 21474xxxxx range is an inference from those ids. */
const isBuiltInTrigger = id => /^21474\d{5}$/.test(String(id));
function triggerGroupIds(t) { const p = (t.parameter || []).find(x => x.key === 'triggerIds'); return p && p.list ? p.list.map(x => String(x.value)) : []; }
function run() {
  $('#err').textContent = ''; let j; try { j = JSON.parse($('#paste').value); } catch (e) { $('#err').textContent = 'That is not valid JSON.'; return; }
  const cv = j.containerVersion || j; if (!cv || !(cv.tag || cv.trigger || cv.variable)) { $('#err').textContent = 'No containerVersion with tags found. Export the container from GTM.'; return; }
  const tags = cv.tag || [], trigs = cv.trigger || [], vars = cv.variable || [], builtIns = (cv.builtInVariable || []).map(v => v.name), folders = cv.folder || [];
  const trigById = new Map(trigs.map(t => [String(t.triggerId), t])), usedTrig = new Set(), varRefs = new Set(), softRefs = new Set(), iss = [], server = /server/i.test(String(cv.usageContext || '') + JSON.stringify((cv.container || {}).usageContext || ''));
  tags.forEach(t => { [t.firingTriggerId, t.blockingTriggerId, t.setupTag && [], t.teardownTag && []].flat().filter(x => x != null && typeof x !== 'object').forEach(x => usedTrig.add(String(x))); if (t.type === 'html') { refs(Object.assign({}, t, { parameter: (t.parameter || []).filter(x => x.key !== 'html') }), varRefs); refs({ h: param(t, 'html') }, softRefs); } else refs(t, varRefs); });
  trigs.forEach(t => { refs(t, varRefs); triggerGroupIds(t).forEach(id => usedTrig.add(id)); }); vars.forEach(v => refs(v, varRefs));
  const tagNames = new Set(tags.map(t => t.name)), setupRefs = new Set(); tags.forEach(t => [].concat(t.setupTag || [], t.teardownTag || []).forEach(s => s && s.tagName && setupRefs.add(s.tagName)));
  const add = (type, name, kind, sev, why, fix) => iss.push({ type, name, kind, sev, why, fix });
  tags.forEach(t => {
    const fire = (t.firingTriggerId || []).map(String), key = t.type;
    if (t.paused) add('Tag', t.name, 'Paused', 'low', 'Tag is paused but still lives in the container.', 'Delete if no longer needed.');
    if (!fire.length && !setupRefs.has(t.name)) add('Tag', t.name, 'No firing trigger', 'high', 'Tag has no firing trigger and is not used as a setup or teardown tag, so it never fires.', 'Attach a trigger or delete the tag.');
    fire.forEach(id => { if (!trigById.has(id) && !isBuiltInTrigger(id)) add('Tag', t.name, 'Missing trigger', 'high', `References trigger ${id}, which does not exist.`, 'Repoint to a valid trigger.'); });
    if (key === 'ua') add('Tag', t.name, 'Deprecated type', 'high', 'Universal Analytics tags no longer collect data.', 'Replace with a GA4 event tag and remove.');
    else if (/^(flc|fls)$/.test(key)) add('Tag', t.name, 'Legacy type', 'med', 'Legacy Floodlight tag type.', 'Migrate to the Google tag with Floodlight events.');
    else if (key === 'sp') add('Tag', t.name, 'Legacy type', 'med', 'Legacy Google Ads remarketing tag.', 'Use the Google Ads remarketing tag or GA4 audiences.');
    if (key === 'html') { const body = param(t, 'html'); if (/document\.write|eval\(/.test(body)) add('Tag', t.name, 'Risky custom HTML', 'med', 'Custom HTML uses document.write or eval.', 'Replace with a template tag or reviewed code.'); if (/<script[^>]+src=["']http:\/\//i.test(body)) add('Tag', t.name, 'Insecure script', 'high', 'Custom HTML loads a script over HTTP.', 'Switch to HTTPS.'); if (/facebook\.net|fbevents|hotjar|clarity\.ms|linkedin\.com\/insight|snap\.licdn|tiktok|analytics\.tiktok|googleads\.g\.doubleclick/i.test(body)) add('Tag', t.name, 'Vendor pixel in custom HTML', 'low', 'A vendor pixel is pasted as custom HTML, which skips consent and template controls.', 'Use the vendor template and consent settings.'); }
    if (t.consentSettings == null || (t.consentSettings.consentStatus === 'notSet' && !(t.consentSettings.consentType || {}).list)) if (key !== 'html' || true) { /* counted below */ }
  });
  const noConsent = server ? [] : tags.filter(t => !t.consentSettings || !t.consentSettings.consentStatus || norm(t.consentSettings.consentStatus) === 'notset');
  const dupMap = new Map(); tags.forEach(t => { const k = sig(Object.assign({}, t, { firingTriggerId: (t.firingTriggerId || []).slice().sort() })); dupMap.set(k, (dupMap.get(k) || []).concat(t.name)); }); dupMap.forEach(a => { if (a.length > 1) add('Tag', a.join(', '), 'Duplicate tags', 'high', 'Identical type, configuration and triggers. This double counts events.', 'Keep one.'); });
  trigs.forEach(t => { if (!usedTrig.has(String(t.triggerId))) add('Trigger', t.name, 'Unused trigger', 'low', 'No tag uses this trigger.', 'Delete it.'); });
  const dupTrig = new Map(); trigs.forEach(t => { const k = sig(t); dupTrig.set(k, (dupTrig.get(k) || []).concat(t.name)); }); dupTrig.forEach(a => { if (a.length > 1) add('Trigger', a.join(', '), 'Duplicate triggers', 'low', 'Same type, conditions and settings (auto-event filters, intervals and limits included).', 'Merge into one trigger.'); });
  vars.forEach(v => { if (!varRefs.has(v.name)) add('Variable', v.name, 'Unused variable', 'low', 'No tag, trigger or variable references it.', 'Delete it.'); });
  const varNames = new Set(vars.map(v => v.name).concat(builtIns.map(x => x)), allBuiltIn = new Set(['Page URL', 'Page Hostname', 'Page Path', 'Referrer', 'Event', 'Click Element', 'Click Classes', 'Click ID', 'Click Target', 'Click URL', 'Click Text', 'Form Element', 'Form Classes', 'Form ID', 'Form Target', 'Form Text', 'Form URL', 'Error Message', 'Error URL', 'Error Line', 'Debug Mode', 'Random Number', 'Container ID', 'Container Version', 'Environment Name', 'History Source', 'New History Fragment', 'Old History Fragment', 'New History State', 'Old History State', 'Video Provider', 'Video Status', 'Video URL', 'Video Title', 'Video Duration', 'Video Current Time', 'Video Percent', 'Video Visible', 'Scroll Depth Threshold', 'Scroll Depth Units', 'Scroll Direction', 'Element Visibility Ratio', 'Percent Visible', 'On-Screen Duration', 'Element Visibility First Time', 'Element Visibility Recent Time', 'Element Visibility Recent Time', 'Custom Event', 'Container Version']));
  softRefs.forEach(n => { if (varNames.has(n)) varRefs.add(n); });
  if (cv.builtInVariable) varRefs.forEach(n => { if (allBuiltIn.has(n) && !varNames.has(n) && !/^_/.test(n)) add('Reference', n, 'Disabled built-in variable', 'med', `{{${n}}} is used, but that built-in variable is not enabled in this container, so it resolves to undefined.`, 'Enable the built-in variable in Variables > Configure.'); });
  varRefs.forEach(n => { if (!varNames.has(n) && !allBuiltIn.has(n) && !/^_/.test(n)) add('Reference', n, 'Undefined variable', 'high', `{{${n}}} is referenced but no variable or enabled built-in variable has that name.`, 'Create the variable or enable the built-in.'); });
  const paused = tags.filter(t => t.paused).length, high = iss.filter(i => i.sev === 'high'), byKind = new Map(); iss.forEach(i => byKind.set(i.kind, (byKind.get(i.kind) || 0) + 1));
  const W = { high: [12, 30], med: [3, 12], low: [1, 8] }; let pen = 0; byKind.forEach((n, kind) => { const sv = iss.find(i => i.kind === kind).sev; pen += Math.min(W[sv][1], W[sv][0] * n); }); const health = Math.max(0, Math.round(100 - pen));
  const typeCount = new Map(); tags.forEach(t => typeCount.set(t.type, (typeCount.get(t.type) || 0) + 1));
  let h = MT.rag(health >= 85 ? 'green' : health >= 60 ? 'yellow' : 'red', `Container health ${health} out of 100`, [`${high.length} high-severity issues across ${tags.length} tags, ${trigs.length} triggers and ${vars.length} variables.`, server ? 'Server-side container: web consent settings do not apply. Clients, transformations and server tags are not audited by this tool.' : `${noConsent.length} of ${tags.length} tags have no consent settings.`]);
  h += MT.stats([['Tags', String(tags.length), paused + ' paused'], ['Triggers', String(trigs.length), iss.filter(i => i.kind === 'Unused trigger').length + ' unused'], ['Variables', String(vars.length), iss.filter(i => i.kind === 'Unused variable').length + ' unused'], ['Folders', String(folders.length), ''], ['Issues', String(iss.length), high.length + ' high', high.length ? 'bad' : 'good']]);
  const sevTag = s => MT.tag(s === 'high' ? 'High' : s === 'med' ? 'Medium' : 'Low', s === 'high' ? 'bad' : s === 'med' ? 'warn' : '');
  h += '<div class="card"><h3>Findings</h3>' + (iss.length ? MT.tbl(['Severity', 'Kind', 'Item', 'Why it matters', 'Fix'], iss.sort((a, b) => ({ high: 0, med: 1, low: 2 })[a.sev] - ({ high: 0, med: 1, low: 2 })[b.sev]).slice(0, 150).map(i => [{ h: sevTag(i.sev) }, i.kind, i.name, i.why, i.fix])) + (iss.length > 150 ? `<p class="muted">Showing the first 150 of ${iss.length} findings, highest severity first. The CSV has all of them.</p>` : '') + '<div class="actions"><button class="btn btn-secondary btn-sm" id="dl" type="button">Download cleanup list (CSV)</button></div>' : '<p class="muted">No issues found.</p>') + '</div>';
  h += '<div class="card"><div id="c1"></div></div>';
  h += MT.note('<b>What this catches.</b> The audit reads the exported JSON only. It cannot see whether a trigger fires in practice, so confirm deletions in Preview mode or with tag firing data. A tag with no firing trigger can be intentional if another tag sequences it; the tool already excludes tags used as setup or teardown tags.');
  $('#out').innerHTML = h;
  const tc = Array.from(typeCount.entries()).sort((a, b) => b[1] - a[1]).slice(0, 12); C.hbars($('#c1'), { title: 'Tags by type (GTM type code)', cats: tc.map(x => x[0]), values: tc.map(x => x[1]), fmt: v => String(v) });
  const dl = $('#dl'); if (dl) dl.addEventListener('click', () => MT.download('gtm-cleanup.csv', MT.toCSV([['severity', 'kind', 'item_type', 'item', 'why', 'fix']].concat(iss.map(i => [i.sev, i.kind, i.type, i.name, i.why, i.fix]))), 'text/csv'));
}
$('#smp').addEventListener('click', () => { const html = '<script src="http://cdn.oldvendor.com/px.js"></' + 'script>'; const j = { exportFormatVersion: 2, containerVersion: { tag: [{ tagId: '1', name: 'GA4 Config', type: 'googtag', parameter: [{ key: 'tagId', value: 'G-ABC123' }], firingTriggerId: ['2147479553'], consentSettings: { consentStatus: 'needed', consentType: { type: 'list', list: [{ type: 'template', value: 'analytics_storage' }] } } }, { tagId: '2', name: 'UA Pageview (old)', type: 'ua', parameter: [{ key: 'trackingId', value: 'UA-1-1' }], firingTriggerId: ['2147479553'] }, { tagId: '3', name: 'GA4 Purchase', type: 'gaawe', parameter: [{ key: 'eventName', value: 'purchase' }, { key: 'value', value: '{{DLV - value}}' }], firingTriggerId: ['5'] }, { tagId: '4', name: 'GA4 Purchase copy', type: 'gaawe', parameter: [{ key: 'eventName', value: 'purchase' }, { key: 'value', value: '{{DLV - value}}' }], firingTriggerId: ['5'] }, { tagId: '5', name: 'FB Pixel', type: 'html', parameter: [{ key: 'html', value: '<script>fbq("init","1")</' + 'script>' }], firingTriggerId: ['2147479553'] }, { tagId: '6', name: 'Old vendor', type: 'html', parameter: [{ key: 'html', value: html }], firingTriggerId: ['99'], paused: true }, { tagId: '7', name: 'Promo click', type: 'gaawe', parameter: [{ key: 'eventName', value: 'promo_click' }] }], trigger: [{ triggerId: '5', name: 'CE - purchase', type: 'customEvent', customEventFilter: [{ type: 'equals', parameter: [{ key: 'arg0', value: '{{_event}}' }, { key: 'arg1', value: 'purchase' }] }] }, { triggerId: '6', name: 'Click - CTA', type: 'click', filter: [] }, { triggerId: '8', name: 'CE - purchase dup', type: 'customEvent', customEventFilter: [{ type: 'equals', parameter: [{ key: 'arg0', value: '{{_event}}' }, { key: 'arg1', value: 'purchase' }] }] }], variable: [{ variableId: '1', name: 'DLV - value', type: 'v', parameter: [{ key: 'name', value: 'value' }] }, { variableId: '2', name: 'Const - old id', type: 'c', parameter: [{ key: 'value', value: 'x' }] }, { variableId: '3', name: 'JS - cart size', type: 'jsm', parameter: [{ key: 'javascript', value: 'function(){return {{DLV - missing}};}' }] }], builtInVariable: [{ type: 'PAGE_URL', name: 'Page URL' }], folder: [{ folderId: '1', name: 'Analytics' }] } }; $('#paste').value = JSON.stringify(j, null, 1); run(); });
$('#go').addEventListener('click', run);
})();
</script>
