<!--META {"title":"Paid Search Seasonality Demand Curve Visualizer","short":"Decompose search demand into trend and seasonal indices, and get starting-point bid adjustments by month and weekday.","desc":"Upload daily or monthly search volume, clicks or conversions. The tool runs a multiplicative decomposition, tests whether the seasonal pattern is real, plots the curve, and shows starting-point bid adjustments.","tag":"Paid search"} -->
<div class="card"><h3>Demand history</h3>
  <p class="sub">Daily or monthly rows with a date and a value (search volume, clicks, conversions or revenue). Three or more years are needed for a tested result; under two years the tool will not draw a seasonal curve. Use one region and one language per file. Daily data adds weekday indices.</p>
  <div id="drop"></div>
  <div class="field" style="margin-top:.6rem"><label for="paste">Or paste CSV</label><textarea id="paste" placeholder="date,value"></textarea></div>
  <div class="row3"><div class="field"><label for="cd">Date</label><select id="cd"></select></div><div class="field"><label for="cv">Value</label><select id="cv"></select></div><div class="field"><label for="dfm">Date format</label><select id="dfm"><option value="auto" selected>Detect (day/month or month/day)</option><option value="dmy">Day first (31/01/2025)</option><option value="mdy">Month first (01/31/2025)</option></select></div><div class="field"><label for="damp">Bid response strength</label><select id="damp"><option value="0.5">Cautious (50% of index)</option><option value="0.75" selected>Balanced (75%)</option><option value="1">Full (100%)</option></select></div></div>
  <div class="actions"><button class="btn btn-primary" id="go" type="button">Decompose</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div><div class="err" id="err"></div>
</div>
<div id="out"></div>
