<!--META {"title":"Demand Forecasting & Inventory Capacity Guardrail","short":"Simulate stockouts and fulfillment bottlenecks from a promo, and get a maximum daily ad spend ceiling.","desc":"Forecast baseline demand with exponential smoothing, layer on promotional lift and paid demand, and simulate inventory against replenishment and shipping capacity. Get a stockout timeline and the highest daily ad spend that stays safe.","tag":"Planning"} -->
<div class="split">
  <div>
    <div class="card"><h3>Inventory and capacity</h3><div id="f1"></div>
      <h3 style="margin-top:1rem">Incoming purchase orders</h3><div id="pos"></div><div class="actions"><button class="btn btn-secondary btn-sm" id="addPo" type="button">Add PO</button></div></div>
    <div class="card"><h3>Baseline demand</h3><div id="f2"></div>
      <div class="field"><label for="hist">Recent daily units sold (optional, oldest first)</label><textarea id="hist" placeholder="Paste numbers separated by commas, spaces or new lines. Used to forecast baseline with Holt's linear trend."></textarea></div></div>
    <div class="card"><h3>Promotion and paid demand</h3><div id="f3"></div></div>
  </div>
  <div id="out" class="out"></div>
</div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, S = MT.stat, C = MT.chart;
let pos = [{ d: 21, q: 4000 }];
MT.fields($('#f1'), [{ id: 'inv', label: 'Units on hand', value: 6000 }, { id: 'cap', label: 'Max units shipped per day', value: 900 }, { id: 'safe', label: 'Safety stock to keep (units)', value: 300 }, { id: 'hor', label: 'Horizon (days)', value: 60, min: 14, max: 180 }], 'g2');
MT.fields($('#f2'), [{ id: 'base', label: 'Baseline units per day (if no history)', value: 250 }], 'g2');
MT.fields($('#f3'), [{ id: 'lift', label: 'Promo lift on baseline (%)', value: 80 }, { id: 'ps', label: 'Promo start (day)', value: 5, min: 0 }, { id: 'pd', label: 'Promo length (days)', value: 10, min: 0 }, { id: 'spend', label: 'Planned daily ad spend ($)', value: 4000 }, { id: 'cpa', label: 'Cost per incremental order ($)', value: 25 }, { id: 'upo', label: 'Units per order', value: 1.4 }], 'g2');
function drawPo() { $('#pos').innerHTML = `<div class="table-wrap"><table class="t"><thead><tr><th>Arrives on day</th><th>Units</th><th></th></tr></thead><tbody>${pos.map((p, i) => `<tr><td><input type="number" data-i="${i}" data-k="d" value="${p.d}"></td><td><input type="number" data-i="${i}" data-k="q" value="${p.q}"></td><td><button class="btn btn-ghost btn-sm" data-d="${i}" type="button">Remove</button></td></tr>`).join('')}</tbody></table></div>`; }
$('#pos').addEventListener('input', e => { const t = e.target; if (t.dataset.i != null) pos[+t.dataset.i][t.dataset.k] = +t.value; });
$('#pos').addEventListener('click', e => { if (e.target.dataset.d != null) { pos.splice(+e.target.dataset.d, 1); drawPo(); run(); } });
$('#addPo').addEventListener('click', () => { pos.push({ d: 30, q: 2000 }); drawPo(); run(); });
function sim(p, spend) {
  const H = p.hor, inv = [], dem = [], ship = [], back = []; let stock = p.inv, bl = 0, first = null, breach = 0, peakBack = 0, minInv = Infinity;
  for (let t = 0; t < H; t++) {
    stock += S.sum(pos.filter(x => Math.round(x.d) === t).map(x => x.q));
    const b = p.forecast(t + 1), promo = t >= p.ps && t < p.ps + p.pd, d = b * (promo ? 1 + p.lift / 100 : 1) + (promo || p.always ? spend / p.cpa * p.upo : 0), need = d + bl, s = Math.max(0, Math.min(p.cap, stock, need));
    if (need > p.cap + 1e-9) breach++; stock -= s; bl = need - s; if (bl > 0.5 && first == null && s >= stock) first = t; if (bl > 0.5 && stock <= 0 && first == null) first = t;
    inv.push(stock); dem.push(d); ship.push(s); back.push(bl); peakBack = Math.max(peakBack, bl); minInv = Math.min(minInv, stock);
  }
  return { inv, dem, ship, back, first, breach, peakBack, minInv, ok: peakBack < 0.5 && minInv >= p.safe - 1e-9 };
}
function run() {
  const hist = $('#hist').value.split(/[\s,;]+/).map(Number).filter(x => isFinite(x) && x >= 0), hor = Math.round(MT.f('hor')) || 60;
  let forecast = () => MT.f('base'), fnote = 'Baseline is constant at the value you entered.';
  if (hist.length >= 8) { const h = S.holt(hist), s = S.ses(hist); forecast = k => Math.max(0, h.forecast(k)); fnote = `Baseline forecast: Holt's linear trend on ${hist.length} days (alpha ${h.a.toFixed(2)}, beta ${h.b.toFixed(2)}, RMSE ${h.rmse.toFixed(1)} units). Day-1 forecast ${forecast(1).toFixed(0)}, day ${hor} forecast ${forecast(hor).toFixed(0)}. Simple smoothing would give a flat ${s.L.toFixed(0)}.`; }
  const p = { inv: MT.f('inv'), cap: MT.f('cap'), safe: MT.f('safe'), hor, lift: MT.f('lift'), ps: MT.f('ps'), pd: MT.f('pd'), cpa: MT.f('cpa'), upo: MT.f('upo'), forecast };
  const spend = MT.f('spend'), r = sim(p, spend);
  // ceiling: highest spend that keeps ok
  let lo = 0, hi = 1e7; if (!sim(p, 0).ok) { hi = 0; } else { for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (sim(p, mid).ok) lo = mid; else hi = mid; } }
  const ceil = lo, dates = MT.range(hor);
  const stock = r.first != null, over = r.breach > 0;
  let h = MT.rag(stock || (over && r.peakBack > 0.5) ? 'red' : over || r.minInv < p.safe ? 'yellow' : 'green', stock ? `Stockout on day ${r.first + 1}` : over ? `Shipping capacity exceeded on ${r.breach} day${r.breach > 1 ? 's' : ''}` : r.minInv < p.safe ? 'Safety stock is breached' : 'Inventory and capacity hold for the whole horizon', [stock ? `Unfilled demand peaks at ${F.int(r.peakBack)} units.` : over ? `Backlog peaks at ${F.int(r.peakBack)} units.` : `Lowest inventory is ${F.int(r.minInv)} units against ${F.int(p.safe)} safety stock.`, ceil > 0 ? `Maximum safe daily ad spend is about ${F.money(ceil, 0)} (planned ${F.money(spend, 0)}).` : 'Even with no ad spend the plan breaches limits.']);
  h += MT.stats([['Max safe daily ad spend', F.money(ceil, 0), spend > ceil ? 'planned spend is above the ceiling' : 'planned spend is within the ceiling', spend > ceil ? 'bad' : 'good'], ['First stockout', stock ? 'Day ' + (r.first + 1) : 'None', ''], ['Days over shipping capacity', String(r.breach), 'capacity ' + F.int(p.cap) + '/day'], ['Peak daily demand', F.int(Math.max(...r.dem)), 'units'], ['Lowest inventory', F.int(r.minInv), 'units'], ['Peak backlog', F.int(r.peakBack), 'units']]);
  h += MT.note(esc(fnote)); h += '<div class="card"><div id="c1"></div><div id="c2"></div></div>';
  h += '<div class="card"><h3>Ceiling logic</h3><p class="sub">The ceiling is found by simulating day by day and raising daily spend until the plan first shows a stockout, backlog or safety stock breach. It respects your shipping capacity, replenishment dates and promo window. Paid demand is modeled as spend divided by cost per incremental order, times units per order, during the promo window.</p></div>';
  $('#out').innerHTML = h;
  C.line($('#c1'), { title: 'Inventory on hand (dashed: safety stock)', xs: dates, xFmt: v => 'Day ' + (v + 1), series: [{ name: 'Inventory', values: r.inv, color: 'var(--series-1)' }, { name: 'Safety stock', values: dates.map(() => p.safe), color: 'var(--series-2)', dash: '5 4' }], zero: true, height: 230 });
  C.line($('#c2'), { title: 'Daily demand vs shipping capacity', xs: dates, xFmt: v => 'Day ' + (v + 1), series: [{ name: 'Demand (incl. backlog: ' + F.int(r.peakBack) + ' peak)', values: r.dem, color: 'var(--series-1)' }, { name: 'Shipping capacity', values: dates.map(() => p.cap), color: 'var(--series-2)', dash: '5 4' }], zero: true, height: 230, table: false });
}
const esc = MT.esc; drawPo(); MT.live(document.querySelector('.split'), run);
})();
</script>
