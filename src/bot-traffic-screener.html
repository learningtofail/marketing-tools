<!--META {"title":"Web Traffic Quality & Bot Anomaly Screener","short":"Separate human traffic from bots and low-quality visits, and get the segment filters to apply in analytics.","desc":"Upload an analytics or server log export. Sessions are screened for data center networks, headless and scripted user agents, zero-second single-page visits and abnormal conversion rates, then summarized as human versus non-human traffic with ready-made segment rules.","tag":"Data governance"} -->
<div class="card"><h3>Traffic export</h3>
  <p class="sub">Any CSV with at least one of: user agent, network domain or ASN, session duration, pages per session. Sessions, bounces and conversions columns add precision. One row can be one session (logs) or an aggregate (analytics).</p>
  <div id="drop"></div>
  <div class="field" style="margin-top:.6rem"><label for="paste">Or paste CSV</label><textarea id="paste" rows="4" placeholder="user_agent,network_domain,country,source,sessions,avg_session_duration,pages_per_session,bounce_rate,conversions"></textarea></div>
  <div class="row3"><div class="field"><label for="cua">User agent</label><select id="cua"></select></div><div class="field"><label for="cnw">Network domain / ASN / ISP</label><select id="cnw"></select></div><div class="field"><label for="cse">Sessions (blank = 1 per row)</label><select id="cse"></select></div></div>
  <div class="row3"><div class="field"><label for="cdu">Session duration (seconds)</label><select id="cdu"></select></div><div class="field"><label for="cpg">Pages per session</label><select id="cpg"></select></div><div class="field"><label for="cbo">Bounce rate or bounces</label><select id="cbo"></select></div></div>
  <div class="row3"><div class="field"><label for="cco">Conversions / leads</label><select id="cco"></select></div><div class="field"><label for="cgr">Extra segment column</label><select id="cgr"></select></div><div class="field"><label for="zs">Zero-second threshold (s)</label><input id="zs" type="number" value="1"></div></div>
  <div class="actions"><button class="btn btn-primary" id="go" type="button">Screen traffic</button><button class="btn btn-secondary btn-sm" id="smp" type="button">Load sample</button></div><div class="err" id="err"></div>
</div>
<div id="out"></div>
<script>
(function () {
const $ = MT.$, F = MT.fmt, S = MT.stat, C = MT.chart; let tab = null;
const DC = /(amazon|aws|ec2|google[\s-]?cloud|googleusercontent|microsoft|azure|digitalocean|ovh|hetzner|linode|akamai|oracle|alibaba|aliyun|tencent|vultr|choopa|leaseweb|m247|colocrossing|datacamp|cogent|quadranet|contabo|scaleway|packet|rackspace|softlayer|ibm cloud|hostinger|hosting|datacenter|data center|server|vps|cloud)/i;
const UA = /(headlesschrome|phantomjs|selenium|puppeteer|playwright|python-requests|python-urllib|aiohttp|curl\/|wget|scrapy|go-http-client|java\/|libwww|okhttp|httpclient|node-fetch|axios|postmanruntime|bot\b|crawler|spider|slurp|ahrefs|semrush|mj12|dotbot|bytespider|petalbot|headless)/i;
function load(t) { tab = MT.readTable(t, /agent|network|session|duration|browser/i); const c = tab.cols; [['#cua', /agent|browser/i], ['#cnw', /network|asn|isp|org|domain|hostname/i], ['#cse', /^sessions?$|visits/i], ['#cdu', /duration|time on/i], ['#cpg', /pages|pageviews/i], ['#cbo', /bounce/i], ['#cco', /conver|lead|goal|transaction/i], ['#cgr', /source|medium|country|campaign|channel/i]].forEach(([id, re]) => { MT.fillSelect($(id), c, re, { none: true }); if (!MT.guess(c, re)) $(id).value = ''; }); }
MT.dropzone($('#drop'), t => { $('#paste').value = t; load(t); }); $('#paste').addEventListener('input', MT.debounce(() => load($('#paste').value), 250));
$('#smp').addEventListener('click', () => { const r = MT.rng(13), rows = [['user_agent', 'network_domain', 'country', 'source', 'sessions', 'avg_session_duration', 'pages_per_session', 'bounce_rate', 'conversions']]; const hum = [['Mozilla/5.0 (iPhone; CPU iPhone OS 17_5) Safari/605.1', 'comcast.net'], ['Mozilla/5.0 (Windows NT 10.0) Chrome/126.0', 'verizon.net'], ['Mozilla/5.0 (Macintosh) Safari/605.1.15', 'spectrum.com'], ['Mozilla/5.0 (Linux; Android 14) Chrome/126.0 Mobile', 'att.net']]; for (let i = 0; i < 90; i++) { const h = hum[i % 4], s = 5 + Math.round(r.u() * 60); rows.push([h[0], h[1], ['US', 'CA', 'GB', 'DE'][i % 4], ['organic', 'cpc', 'email', 'direct'][i % 4], s, (55 + r.u() * 90).toFixed(0), (2.4 + r.u() * 2).toFixed(1), (0.35 + r.u() * 0.2).toFixed(2), Math.round(s * 0.045 * (0.6 + r.u() * 0.8))]); } for (let i = 0; i < 14; i++) { const s = 30 + Math.round(r.u() * 200); rows.push(['Mozilla/5.0 (X11; Linux x86_64) HeadlessChrome/125.0', 'amazonaws.com', 'US', 'display', s, (0.2).toFixed(1), '1.0', '0.99', 0]); } for (let i = 0; i < 8; i++) { const s = 40 + Math.round(r.u() * 120); rows.push(['python-requests/2.31', 'digitalocean.com', 'SG', 'referral', s, '0', '1.0', '1.00', 0]); } for (let i = 0; i < 6; i++) { const s = 60 + Math.round(r.u() * 100); rows.push(['Mozilla/5.0 (Windows NT 10.0) Chrome/120.0', 'residential-isp.net', 'VN', 'paid_social', s, '0.4', '1.0', '0.97', 0]); } const t = MT.toCSV(rows); $('#paste').value = t; load(t); run(); });
function run() {
  $('#err').textContent = ''; if (!tab) { $('#err').textContent = 'Paste or upload an export first.'; return; }
  const g = id => $(id).value, ua = g('#cua'), nw = g('#cnw'), se = g('#cse'), du = g('#cdu'), pg = g('#cpg'), bo = g('#cbo'), co = g('#cco'), gr = g('#cgr'), zs = MT.val('zs');
  if (!ua && !nw && !du && !pg) { $('#err').textContent = 'Map at least one of user agent, network, duration or pages.'; return; }
  const rows = tab.rows.map(r => { const w = se ? MT.num(r[se]) : 1; if (!isFinite(w) || w <= 0) return null; const o = { w, ua: ua ? String(r[ua]) : '', nw: nw ? String(r[nw]) : '', dur: du ? MT.num(r[du]) : NaN, pg: pg ? MT.num(r[pg]) : NaN, bo: bo ? MT.pctNum(r[bo]) : NaN, cv: co ? (MT.num(r[co]) || 0) : NaN, seg: gr ? String(r[gr]) : '' }; if (isFinite(o.bo) && o.bo > 1 && o.bo <= 100 && /%|rate/i.test(bo) || (isFinite(o.bo) && o.bo > 1 && /rate/i.test(bo))) o.bo /= 100; if (isFinite(o.bo) && /bounces$/i.test(bo) && o.bo > 1) o.bo = Math.min(1, o.bo / w); return o; }).filter(Boolean);
  if (!rows.length) { $('#err').textContent = 'No usable rows.'; return; }
  rows.forEach(o => { const rs = []; if (o.ua && UA.test(o.ua)) rs.push('Bot or headless user agent'); if (o.nw && DC.test(o.nw)) rs.push('Data center network'); const zero = isFinite(o.dur) && o.dur <= zs && (!isFinite(o.pg) || o.pg <= 1.05) && (!isFinite(o.bo) || o.bo >= 0.9); if (zero) rs.push('Zero-second single-page visits'); o.rs = rs; o.cls = (rs.includes('Bot or headless user agent') || rs.includes('Data center network')) ? 'bot' : zero ? 'suspect' : 'human'; });
  const tw = a => S.sum(a.map(o => o.w)), total = tw(rows), by = c => rows.filter(o => o.cls === c), bot = tw(by('bot')), sus = tw(by('suspect')), hum = tw(by('human')), hasCv = co && rows.some(o => isFinite(o.cv));
  const cvAll = hasCv ? S.sum(rows.map(o => o.cv)) : NaN, cvHuman = hasCv ? S.sum(by('human').map(o => o.cv)) : NaN;
  const site = hasCv ? cvHuman / Math.max(hum, 1) : NaN;
  // anomalous segments: high volume, conv rate far below human rate
  const seg = (name, keyf) => { const m = new Map(); rows.forEach(o => { const k = keyf(o); if (!k) return; const e = m.get(k) || { k, w: 0, cv: 0, bot: 0, dur: 0, dn: 0, zero: 0 }; e.w += o.w; e.cv += isFinite(o.cv) ? o.cv : 0; if (o.cls !== 'human') e.bot += o.w; if (isFinite(o.dur)) { e.dur += o.dur * o.w; e.dn += o.w; } if (isFinite(o.dur) && o.dur <= zs) e.zero += o.w; m.set(k, e); }); return Array.from(m.values()).map(e => Object.assign(e, { dim: name, botShare: e.bot / e.w, cr: hasCv ? e.cv / e.w : NaN, avgDur: e.dn ? e.dur / e.dn : NaN, z: hasCv && isFinite(site) && e.w >= 50 ? (function () { const p0 = site, se = Math.sqrt(p0 * (1 - p0) / e.w); return se > 0 ? (e.cv / e.w - p0) / se : 0; })() : 0 })); };
  const segs = [].concat(nw ? seg('Network', o => o.nw.toLowerCase().trim()) : [], ua ? seg('User agent', o => o.ua.replace(/\d+(\.\d+)*/g, 'x').slice(0, 60)) : [], gr ? seg(g('#cgr'), o => o.seg) : []);
  const flagged = segs.filter(s => s.w >= Math.max(50, total * 0.005) && (s.botShare >= 0.6 || (hasCv && s.z < -3 && s.cr < (site || 0) * 0.25))).sort((a, b) => b.w - a.w).slice(0, 25);
  const inflated = (bot + sus) / total;
  let h = MT.verdict(inflated > 0.15 ? 'neg' : inflated > 0.05 ? 'neu' : 'pos', `${F.pct(hum / total, 1)} human traffic, ${F.pct(bot / total, 1)} bots, ${F.pct(sus / total, 1)} suspect`, `${F.int(bot + sus)} of ${F.int(total)} sessions look non-human or low quality. Reported traffic is inflated by ${F.pct(inflated / Math.max(1 - inflated, 1e-9), 1)} versus the human baseline.${hasCv ? ` Conversion rate improves from ${F.pct(cvAll / total, 2)} to ${F.pct(site, 2)} after filtering.` : ''}`);
  h += MT.stats([['Total sessions', F.int(total), ''], ['Human', F.int(hum), F.pct(hum / total, 1)], ['Bots', F.int(bot), F.pct(bot / total, 1), bot / total > 0.1 ? 'bad' : ''], ['Suspect', F.int(sus), F.pct(sus / total, 1), sus / total > 0.05 ? 'warn' : '']]);
  h += '<div class="card"><div id="c1"></div></div>';
  const reasons = new Map(); rows.forEach(o => o.rs.forEach(x => reasons.set(x, (reasons.get(x) || 0) + o.w)));
  h += '<div class="card"><h3>Why sessions were flagged</h3>' + MT.tbl(['Rule', 'Sessions', 'Share'], Array.from(reasons.entries()).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, F.int(v), F.pct(v / total, 1)]), { num: [1, 2] }) + '</div>';
  h += '<div class="card"><h3>Segments to exclude or investigate</h3>' + (flagged.length ? MT.tbl(['Dimension', 'Segment', 'Sessions', 'Non-human share', ...(hasCv ? ['Conv. rate'] : []), 'Avg duration'], flagged.map(s => [s.dim, s.k, F.int(s.w), F.pct(s.botShare, 0), ...(hasCv ? [F.pct(s.cr, 2)] : []), isFinite(s.avgDur) ? s.avgDur.toFixed(1) + 's' : '—']), { num: [2, 3, 4, 5] }) : '<p class="muted">No segment stands out.</p>') + '</div>';
  const nets = flagged.filter(s => s.dim === 'Network').map(s => s.k), uas = flagged.filter(s => s.dim === 'User agent').map(s => s.k);
  let rules = 'GA4 Explore segment (exclude sessions where any is true)\n'; if (nets.length) rules += ' - Network domain / hostname contains: ' + nets.join(' | ') + '\n'; rules += ' - Session duration under ' + (zs + 1) + ' seconds AND views per session = 1 AND Country not in your target markets\n'; if (uas.length) rules += ' - Browser / user agent matches: ' + uas.join(' | ') + '\n'; rules += ' - Hostname does not equal your domain (ghost spam)\nServer log filter (regex on user agent): ' + UA.source.replace(/\\b/g, '\\b');
  h += '<div class="card"><h3>Segmentation criteria</h3><pre class="code" id="rules">' + MT.esc(rules) + '</pre><div class="actions"><button class="btn btn-secondary btn-sm" id="cp" type="button">Copy rules</button></div></div>';
  h += MT.note('<b>Limits.</b> The data center list matches network names, not IP ranges, so it catches named clouds and hosts but misses residential proxies. Zero-second single-page visits are tagged suspect rather than bot because slow-loading pages and tab closes produce them too. Confirm large flagged segments in raw logs before excluding them from historic reporting.');
  $('#out').innerHTML = h;
  C.bars($('#c1'), { title: 'Sessions by class', cats: ['Human', 'Suspect', 'Bot'], series: [{ name: 'Sessions', values: [hum, sus, bot], color: 'var(--series-1)' }], yFmt: v => F.int(v) });
  $('#cp').addEventListener('click', e => MT.copy(rules, e.target));
}
$('#go').addEventListener('click', run);
})();
</script>
